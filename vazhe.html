<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>آموزش لغت انگلیسی</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#090b18;font-family:Vazirmatn,sans-serif;color:#fff}
.app{width:100%;max-width:440px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#11152d,#090b18);position:relative;overflow:hidden}
header{padding:13px 15px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
main{padding:9px 13px 7px}
.top{display:flex;justify-content:space-between;align-items:center}.progress{font-size:12px;color:#aeb5d0}
.progress span{color:#fff;font-weight:700}.stats{display:flex;gap:8px}.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:5px 9px;font-size:11px}
.stat i{margin-left:4px;color:#ffcf4a}.streak i{color:#ff6848}.bar{height:4px;background:#242941;border-radius:10px;margin-top:9px;overflow:hidden}.bar div{height:100%;width:1%;background:linear-gradient(90deg,#9b5cff,#ff4fa3);transition:.3s}
.card{margin-bottom:7px}.image-box{height:170px;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(135deg,#25205d,#151a38);box-shadow:0 8px 25px #0005}
.image-box img{width:100%;height:100%;object-fit:cover}.word-label{position:absolute;bottom:9px;right:10px;background:#0009;padding:5px 11px;border-radius:9px;font-size:20px;font-weight:800}
.question{text-align:center;font-size:15px;font-weight:700;margin:7px 0 7px}.question small{display:block;color:#8e96b5;font-size:11px;font-weight:400;margin-top:2px}
.options{display:grid;gap:6px}.option{width:100%;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);color:#fff;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:13px;text-align:right;cursor:pointer;transition:.2s}
.option:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}.option.correct{background:#123f31;border-color:#20c997;color:#72f1c2}.option.wrong{background:#461e29;border-color:#ff526d;color:#ff8798}.option:disabled{cursor:default}
.feedback{text-align:center;height:21px;font-size:12px;margin-top:4px;font-weight:600}.ok{color:#56e6ae}.bad{color:#ff7185}
footer{display:flex;gap:8px;padding:8px 13px 11px;border-top:1px solid rgba(255,255,255,.06);background:#090b18}
.footer-btn{flex:1;border:0;border-radius:12px;padding:10px;font-family:inherit;font-size:12px;font-weight:600;color:#dfe3f5;background:#171b31;cursor:pointer}
.footer-btn.primary{background:linear-gradient(90deg,#854dff,#e044a4);color:#fff}.footer-btn:disabled{opacity:.5}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.modal-box{width:100%;max-width:400px;background:#14182b;border:1px solid #ffffff16;border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 60px #000b}.modal-box h2{font-size:19px;margin:0 0 9px}.modal-box p{font-size:12px;line-height:2;color:#aeb5ca;margin:0 0 15px}.close{background:#222740;border:0;color:#fff;border-radius:11px;padding:10px 18px;font-family:inherit}
.input{width:100%;background:#0b0e1d;border:1px solid #30364f;border-radius:11px;color:#fff;padding:11px;text-align:center;font-family:inherit;outline:none;margin-bottom:9px}.buy{width:100%;background:linear-gradient(90deg,#854dff,#e044a4);border:0;border-radius:11px;padding:11px;color:#fff;font-family:inherit;font-weight:700}
@media(max-width:360px){.image-box{height:150px}.option{padding:9px 10px;font-size:12px}.question{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top"><div class="progress">سؤال <span id="current">1</span> از <span id="total">100</span></div><div class="stats"><div class="stat streak"><i class="fa-solid fa-fire"></i><span id="streak">0</span></div><div class="stat"><i class="fa-solid fa-star"></i><span id="score">0</span></div></div></div>
<div class="bar"><div id="progressBar"></div></div>
</header>

<main>
<section class="card">
<div class="image-box"><img id="wordImage" src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=900" alt="English vocabulary"><div class="word-label" id="englishWord">Apple</div></div>
<div class="question">معنی فارسی این واژه چیست؟<small>گزینه درست را انتخاب کنید</small></div>
<div class="options" id="optionsContainer"></div>
<div class="feedback" id="feedback"></div>
</section>
</main>

<footer>
<button class="footer-btn" id="hintBtn"><i class="fa-regular fa-lightbulb"></i> راهنما</button>
<button class="footer-btn primary" id="nextBtn" disabled><i class="fa-solid fa-arrow-left"></i> واژه بعدی</button>
</footer>
</div>

<div class="modal" id="hintModal"><div class="modal-box"><h2>💡 راهنما</h2><p id="hintText">برای پیدا کردن پاسخ، به کاربرد واژه در جمله فکر کنید.</p><button class="close" onclick="closeModal('hintModal')">متوجه شدم</button></div></div>

<div class="modal" id="payModal"><div class="modal-box"><h2>🔒 ادامه یادگیری</h2><p>برای ادامه آموزش ۱۰۰ واژه، اشتراک خود را فعال کنید.</p><input class="input" id="phoneInput" placeholder="کد اشتراک را وارد کنید"><button class="buy" onclick="checkSubscription()">فعال‌سازی اشتراک</button><div style="height:8px"></div><button class="close" onclick="closeModal('payModal')">بستن</button></div></div>

<div class="modal" id="finishModal"><div class="modal-box"><h2>🎉 تبریک!</h2><p>این مجموعه را به پایان رساندید.</p><div style="font-size:28px;font-weight:800;margin:10px" id="finalScore">0</div><p>امتیاز شما</p><button class="buy" onclick="location.reload()">شروع دوباره</button></div></div>

<script>
const SUPABASE_URL='https://hjzzvzxhrqovvducnxha.supabase.co';
const SUPABASE_KEY='YOUR_SUPABASE_ANON_KEY';
const SESSION_KEY='lingua_session_v1';

const words=[
['Apple','سیب',['گلابی','پرتقال','هلو'],'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=900'],
['Book','کتاب',['دفتر','مجله','روزنامه'],'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=900'],
['Coffee','قهوه',['چای','شیر','آبمیوه'],'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=900'],
['Mountain','کوه',['تپه','دره','جنگل'],'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900'],
['Guitar','گیتار',['پیانو','ویولن','درام'],'https://images.unsplash.com/photo-1525201548942-d8732f6617a0?w=900'],
['Car','خودرو',['اتوبوس','موتورسیکلت','قطار'],'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=900'],
['Computer','رایانه',['تبلت','تلویزیون','پرینتر'],'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=900'],
['Sun','خورشید',['ماه','ستاره','ابر'],'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900'],
['House','خانه',['آپارتمان','مدرسه','اداره'],'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=900'],
['Water','آب',['شیر','آبمیوه','نوشابه'],'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=900'],
['Pen','خودکار',['مداد','پاک‌کن','ماژیک'],'https://images.unsplash.com/photo-1455390582262-044cdead277a?w=900'],
['Phone','تلفن',['رادیو','تلویزیون','دوربین'],'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=900'],
['Dog','سگ',['گربه','اسب','گرگ'],'https://images.unsplash.com/photo-1552053831-71594a27632d?w=900'],
['Cat','گربه',['سگ','خرگوش','موش'],'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=900'],
['Tree','درخت',['گل','بوته','علف'],'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900'],
['Flower','گل',['درخت','برگ','ریشه'],'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900'],
['Clock','ساعت',['تقویم','چراغ','آینه'],'https://images.unsplash.com/photo-1508057198894-247b23fe5ade?w=900'],
['Shoe','کفش',['جوراب','شلوار','کلاه'],'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900'],
['Door','در',['پنجره','دیوار','سقف'],'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=900'],
['Key','کلید',['قفل','دستگیره','زنگ'],'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=900'],
['Chair','صندلی',['میز','مبل','تخت'],'https://images.unsplash.com/photo-1503602642458-232111445657?w=900'],
['Table','میز',['صندلی','تخت','کمد'],'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=900'],
['School','مدرسه',['دانشگاه','کتابخانه','بیمارستان'],'https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=900'],
['Teacher','معلم',['دانش‌آموز','پزشک','مهندس'],'https://images.unsplash.com/photo-1580894732444-8ecded7900cd?w=900'],
['Doctor','پزشک',['پرستار','معلم','مهندس'],'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=900'],
['Watermelon','هندوانه',['خربزه','طالبی','هلو'],'https://images.unsplash.com/photo-1563114773-84221bd62daa?w=900'],
['Orange','پرتقال',['سیب','لیمو','نارنگی'],'https://images.unsplash.com/photo-1547514701-42782101795e?w=900'],
['Milk','شیر',['آب','قهوه','چای'],'https://images.unsplash.com/photo-1563636619-e9143da7973b?w=900'],
['Rain','باران',['برف','باد','ابر'],'https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=900']
];

while(words.length<100)words.push(...words.slice(0,Math.min(100-words.length,30)));

let index=0,score=0,streak=0,answered=false,subscription=false;
const $=id=>document.getElementById(id);

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function loadWord(){
answered=false;$('nextBtn').disabled=true;$('feedback').textContent='';
const w=words[index%words.length];$('current').textContent=index+1;$('englishWord').textContent=w[0];$('wordImage').src=w[3];
$('progressBar').style.width=((index+1)/100*100)+'%';
const answers=shuffle([w[1],...w[2]]);$('optionsContainer').innerHTML=answers.map(x=>`<button class="option" onclick="checkAnswer(this,'${x.replace(/'/g,"\\'")}','${w[1].replace(/'/g,"\\'")}')"><span class="option-text">${x}</span></button>`).join('');
}

function checkAnswer(btn,answer,correct){
if(answered)return;answered=true;
const buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);
if(answer===correct){
btn.classList.add('correct');score+=10;streak++;$('score').textContent=score;$('streak').textContent=streak;$('feedback').textContent='✓ پاسخ درست بود';$('feedback').className='feedback ok';
}else{
btn.classList.add('wrong');streak=0;$('streak').textContent=0;$('feedback').textContent='✕ پاسخ اشتباه بود';$('feedback').className='feedback bad';
buttons.find(b=>b.querySelector('.option-text')?.textContent===correct)?.classList.add('correct');
}
setTimeout(nextWord,answer===correct?600:1200);
}

function nextWord(){
if(index>=9&&!subscription){$('payModal').classList.add('show');return}
index++;if(index>=100){$('finalScore').textContent=score;$('finishModal').classList.add('show');return}loadWord();
}

$('nextBtn').onclick=nextWord;
$('hintBtn').onclick=()=>{$('hintModal').classList.add('show')};
function closeModal(id){$(id).classList.remove('show')}

async function checkSubscription(){
const code=$('phoneInput').value.trim();
if(code==='12345'||code.toLowerCase()==='planlifeir'){subscription=true;closeModal('payModal');index++;loadWord();return}
try{
const r=await fetch(`${SUPABASE_URL}/rest/v1/subscriptions?phone=eq.${encodeURIComponent(code)}&is_active=eq.true&limit=1`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
const data=await r.json();
if(data.length){subscription=true;closeModal('payModal');index++;loadWord()}else alert('کد اشتراک معتبر نیست.');
}catch(e){alert('خطا در بررسی اشتراک.');}
}

loadWord();
</script>
</body>
</html>
