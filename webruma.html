<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نمونه کارها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--fg:#14162b;--mut:#6b6f8a;--card:#fff;--line:#e3e5f0;--acc:#6c5ce7;--dev:#14162b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e1a;--fg:#f1f2fa;--mut:#9a9eb8;--card:#171830;--line:#272946;--dev:#050610}}
:root[data-theme="dark"]{--bg:#0d0e1a;--fg:#f1f2fa;--mut:#9a9eb8;--card:#171830;--line:#272946;--dev:#050610}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
/* Hero */
.hero{position:relative;height:min(70vh,520px);overflow:hidden;margin:12px;border-radius:28px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,7vw,90px);color:#fff;opacity:0;transform:scale(1.04);transition:opacity .8s,transform 1.2s}
.slide.on{opacity:1;transform:none}
.slide h1{font-size:clamp(28px,5.5vw,56px);font-weight:800;line-height:1.3;max-width:640px}
.slide p{margin-top:12px;max-width:520px;opacity:.9;font-size:clamp(14px,2vw,18px)}
.slide a{margin-top:22px;align-self:flex-start;background:#fff;color:#14162b;padding:10px 26px;border-radius:99px;font-weight:600;text-decoration:none}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots button{width:9px;height:9px;border-radius:9px;border:0;background:#ffffff80;cursor:pointer;transition:.3s}
.dots button.on{width:28px;background:#fff}
/* Filter */
.filter{text-align:center;padding:34px 16px 6px}
.filter h2{font-size:clamp(20px,3vw,28px);font-weight:800}
.filter p{color:var(--mut);font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.chips button{font:inherit;font-size:14px;padding:8px 20px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;transition:.25s}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* Rows */
.row{padding:34px 0 6px}
.row-h{display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);margin-bottom:16px}
.row-h h3{font-size:18px;font-weight:600}
.arrows{display:flex;gap:8px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
.arrows button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.track{display:flex;gap:28px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px clamp(16px,4vw,48px) 28px;scrollbar-width:none;align-items:flex-end}
.track::-webkit-scrollbar{display:none}
.item{flex:none;scroll-snap-align:center;transition:opacity .3s}
.item.hide{display:none}
.item img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;background:#ccc}
.cap{text-align:center;font-size:13px;color:var(--mut);margin-top:12px}
/* iPhone */
.phone{width:210px;aspect-ratio:9/16;background:var(--dev);border-radius:36px;padding:8px;position:relative;box-shadow:0 18px 40px #0003,inset 0 0 0 2px #444}
.phone .scr{width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative}
.phone .scr::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:64px;height:18px;border-radius:12px;background:#000;z-index:2}
/* Laptop */
.laptop{width:520px;aspect-ratio:900/700;position:relative}
.laptop .scr{position:absolute;left:5.78%;top:2.57%;width:85.4%;height:74.3%;overflow:hidden;border-radius:1.6%/2%;background:#fff}
.laptop .frm{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:none;pointer-events:none;z-index:2}
/* Monitor */
.monitor{width:500px;aspect-ratio:900/700;position:relative}
.monitor .scr{position:absolute;left:5.89%;top:5.86%;width:88.4%;height:63.7%;overflow:hidden;background:#fff}
/* Tablet */
.tablet{width:340px;aspect-ratio:480/500;position:relative}
.tablet .scr{position:absolute;left:22.08%;top:3.2%;width:72.5%;height:93.2%;overflow:hidden;border-radius:4%/3%;background:#fff}
.monitor .frm,.tablet .frm{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:none;pointer-events:none;z-index:2}
.empty{display:none;text-align:center;color:var(--mut);padding:10px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:40px 16px 30px}
@media(max-width:600px){.phone{width:170px}.laptop{width:330px}.tablet{width:260px}.monitor{width:310px}.hero{height:60vh;border-radius:22px}}
</style>
</head>
<body>

<section class="hero" id="hero"></section>

<section class="filter">
  <h2>حوزه کاری خود را انتخاب کنید</h2>
  <p>نمونه کارهای مرتبط با کسب‌وکار شما</p>
  <div class="chips" id="chips"></div>
</section>

<section class="row"><div class="row-h"><h3>📱 نسخه موبایل</h3><div class="arrows"><button data-t="phone" data-d="1" aria-label="قبلی">›</button><button data-t="phone" data-d="-1" aria-label="بعدی">‹</button></div></div><div class="track" id="phone"></div></section>
<section class="row"><div class="row-h"><h3>💻 نسخه دسکتاپ</h3><div class="arrows"><button data-t="laptop" data-d="1" aria-label="قبلی">›</button><button data-t="laptop" data-d="-1" aria-label="بعدی">‹</button></div></div><div class="track" id="laptop"></div></section>
<section class="row"><div class="row-h"><h3>🖥️ نسخه مانیتور (PC)</h3><div class="arrows"><button data-t="monitor" data-d="1" aria-label="قبلی">›</button><button data-t="monitor" data-d="-1" aria-label="بعدی">‹</button></div></div><div class="track" id="monitor"></div></section>
<section class="row"><div class="row-h"><h3>📲 نسخه تبلت</h3><div class="arrows"><button data-t="tablet" data-d="1" aria-label="قبلی">›</button><button data-t="tablet" data-d="-1" aria-label="بعدی">‹</button></div></div><div class="track" id="tablet"></div></section>

<footer>© نمونه کارها</footer>

  {t:'نمونه کارهای ما را ببینید',p:'حوزه کاری خود را انتخاب کنید و نمونه‌های مرتبط را ببینید',g:'linear-gradient(135deg,#e17055,#fdcb6e)'}
];
/* ========================================================= */

const SIZE = {phone:[390,720],laptop:[1440,975],tablet:[768,1030],monitor:[1600,900]};
function mock(type,i,title){
  const [w,h]=SIZE[type],hue=(i*37+(type==='laptop'?120:type==='tablet'?240:0))%360;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},75%,58%)"/><stop offset="1" stop-color="hsl(${hue+50},75%,45%)"/></linearGradient></defs><rect width="${w}" height="${h}" fill="#f4f5fa"/><rect width="${w}" height="${h*.07}" fill="#fff"/><rect x="${w*.05}" y="${h*.022}" width="${w*.12}" height="${h*.026}" rx="6" fill="url(#g)"/><rect x="${w*.04}" y="${h*.1}" width="${w*.92}" height="${h*.34}" rx="${w*.025}" fill="url(#g)"/><text x="${w/2}" y="${h*.28}" font-size="${w*.055}" font-family="Tahoma,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">${title}</text>`+
  [0,1,2].map(k=>`<rect x="${w*(.04+k*.32)}" y="${h*.48}" width="${w*.28}" height="${h*.2}" rx="${w*.02}" fill="#fff"/><rect x="${w*(.06+k*.32)}" y="${h*.5}" width="${w*.24}" height="${h*.11}" rx="${w*.015}" fill="hsl(${hue+k*25},60%,85%)"/>`).join('')+
  `<rect x="${w*.04}" y="${h*.72}" width="${w*.92}" height="${h*.05}" rx="8" fill="#fff"/><rect x="${w*.04}" y="${h*.8}" width="${w*.6}" height="${h*.03}" rx="8" fill="#dfe1ee"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}

/* Hero */
const hero=document.getElementById('hero');let cur=0,timer;
hero.innerHTML=SLIDES.map((s,i)=>`<div class="slide${i?'':' on'}" style="background:${s.g}"><h1>${s.t}</h1><p>${s.p}</p><a href="#chips">مشاهده نمونه کارها</a></div>`).join('')+'<div class="dots">'+SLIDES.map((_,i)=>`<button class="${i?'':'on'}" aria-label="اسلاید ${i+1}"></button>`).join('')+'</div>';
const sl=[...hero.querySelectorAll('.slide')],dt=[...hero.querySelectorAll('.dots button')];
function go(n){cur=(n+sl.length)%sl.length;sl.forEach((e,i)=>e.classList.toggle('on',i===cur));dt.forEach((e,i)=>e.classList.toggle('on',i===cur));clearInterval(timer);timer=setInterval(()=>go(cur+1),5000)}
dt.forEach((b,i)=>b.onclick=()=>go(i));go(0);

/* Gallery */
for(const type in IMAGES){
  document.getElementById(type).innerHTML=IMAGES[type].map((m,i)=>{
    const img=`<img loading="lazy" src="${m.src||mock(type,i,m.title)}" alt="${m.title}">`;
    const frame=type==='phone'?`<div class="phone"><div class="scr">${img}</div></div>`
      :type==='laptop'?`<div class="laptop"><div class="scr">${img}</div><img class="frm" src="${LAPTOP_FRAME}" alt=""></div>`
      :type==='monitor'?`<div class="monitor"><div class="scr">${img}</div><img class="frm" src="${MONITOR_FRAME}" alt=""></div>`
      :`<div class="tablet"><div class="scr">${img}</div><img class="frm" src="${TABLET_FRAME}" alt=""></div>`;
    return `<div class="item" data-cat="${m.cat}">${frame}<div class="cap">${m.title}</div></div>`;
  }).join('');
}

/* Filter */
const chips=document.getElementById('chips');
chips.innerHTML=`<button class="on" data-c="all">همه</button>`+Object.entries(CATS).map(([k,v])=>`<button data-c="${k}">${v}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  chips.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.item').forEach(it=>it.classList.toggle('hide',b.dataset.c!=='all'&&it.dataset.cat!==b.dataset.c));
  document.querySelectorAll('.track').forEach(t=>t.scrollTo({left:0}));};

/* Arrows (RTL-safe) */
document.querySelectorAll('.arrows button').forEach(b=>b.onclick=()=>{
  const t=document.getElementById(b.dataset.t);
  t.scrollBy({left:-Number(b.dataset.d)*t.clientWidth*.7,behavior:'smooth'});
});
</script>
</body>
</html>
