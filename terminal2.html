<script>

const SUPABASE_URL='https://hjzzvzxhrqovvducnxha.supabase.co';

const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqenp2enhocXY...';

const ACCESS_CODE_LENGTH=6;


/* ================= SUPABASE ================= */

async function sbGet(table,filter){

  const r=await fetch(
    `${SUPABASE_URL}/rest/v1/${table}?select=phone&${filter}&limit=1`,
    {
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY
      }
    }
  );

  if(!r.ok){
    throw new Error('supabase');
  }

  return r.json();
}

const W=941,H=1672,S=W/941;

const px=(el,cx,cy,w,h)=>{

  cx*=S;
  cy*=S;
  w*=S;
  h*=S;

  const l=cx-w/2;
  const t=cy-h/2;

  Object.assign(el.style,{
    left:l/W*100+"%",
    top:t/H*100+"%",
    width:w/W*100+"%",
    height:h/H*100+"%"
  });

  return{l,t,w,h};
};

/* ================= صدای مرموز ================= */

let ac,bus;

function initAudio(){

  if(ac){
    if(ac.state==="suspended")ac.resume();
    return;
  }

  ac=new(window.AudioContext||window.webkitAudioContext)();

  bus=ac.createGain();
  bus.gain.value=.9;
  bus.connect(ac.destination);

  const len=ac.sampleRate*2.6;
  const ir=ac.createBuffer(2,len,ac.sampleRate);

  for(let c=0;c<2;c++){

    const d=ir.getChannelData(c);

    for(let i=0;i<len;i++){
      d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);
    }
  }

  const conv=ac.createConvolver();
  conv.buffer=ir;

  const wet=ac.createGain();
  wet.gain.value=.12;

  bus.connect(conv);
  conv.connect(wet);
  wet.connect(ac.destination);
}

function env(g,t,a,d,v){

  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
}

function bell(f,d=1.6,v=.09,delay=0){

  const t=ac.currentTime+delay;

  [[1,1],[2.01,.5],[2.76,.32],[5.4,.14]].forEach(([m,a])=>{

    const o=ac.createOscillator();
    const g=ac.createGain();

    o.type="sine";
    o.frequency.value=f*m*(1+(Math.random()-.5)*.004);

    env(g,t,.006,d/(m**.5),v*a);

    o.connect(g).connect(bus);

    o.start(t);
    o.stop(t+d+.1);
  });
}

function thud(f=95,d=.45,v=.5,delay=0){

  const t=ac.currentTime+delay;

  const o=ac.createOscillator();
  const g=ac.createGain();

  o.frequency.setValueAtTime(f,t);
  o.frequency.exponentialRampToValueAtTime(34,t+d);

  env(g,t,.004,d,v);

  o.connect(g).connect(bus);

  o.start(t);
  o.stop(t+d+.05);
}

function whoosh(from=250,to=1400,d=.6,v=.12,delay=0){

  const t=ac.currentTime+delay;

  const n=ac.createBufferSource();

  const b=ac.createBuffer(
    1,
    ac.sampleRate*d,
    ac.sampleRate
  );

  const x=b.getChannelData(0);

  for(let i=0;i<x.length;i++){
    x[i]=Math.random()*2-1;
  }

  n.buffer=b;

  const f=ac.createBiquadFilter();

  f.type="bandpass";
  f.Q.value=5;

  f.frequency.setValueAtTime(from,t);
  f.frequency.exponentialRampToValueAtTime(to,t+d);

  const g=ac.createGain();

  env(g,t,d*.4,d*.6,v);

  n.connect(f).connect(g).connect(bus);

  n.start(t);
}

function drone(freqs,d=2.2,v=.07,type="sine",lp=900,delay=0){

  const t=ac.currentTime+delay;

  const f=ac.createBiquadFilter();

  f.type="lowpass";

  f.frequency.setValueAtTime(lp*.3,t);
  f.frequency.exponentialRampToValueAtTime(lp,t+d*.4);

  const g=ac.createGain();

  env(g,t,d*.35,d*.65,v);

  f.connect(g).connect(bus);

  freqs.forEach((fr,i)=>{

    const o=ac.createOscillator();

    o.type=type;
    o.frequency.value=fr;
    o.detune.value=(i%2?7:-7);

    o.connect(f);

    o.start(t);
    o.stop(t+d+.1);
  });
}

function electricKey(){

  if(!ac)return;

  const t=ac.currentTime;

  const freq=680+Math.random()*90;

  const o=ac.createOscillator();
  const g=ac.createGain();
  const f=ac.createBiquadFilter();

  o.type="square";

  o.frequency.setValueAtTime(freq,t);
  o.frequency.exponentialRampToValueAtTime(freq*.72,t+.035);

  f.type="bandpass";
  f.frequency.value=1450;
  f.Q.value=7;

  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.105,t+.002);
  g.gain.exponentialRampToValueAtTime(.0001,t+.052);

  o.connect(f).connect(g).connect(bus);

  o.start(t);
  o.stop(t+.058);

  const n=ac.createBufferSource();

  const b=ac.createBuffer(
    1,
    Math.floor(ac.sampleRate*.018),
    ac.sampleRate
  );

  const d=b.getChannelData(0);

  for(let i=0;i<d.length;i++){
    d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  }

  const nf=ac.createBiquadFilter();

  nf.type="highpass";
  nf.frequency.value=2600;

  const ng=ac.createGain();

  ng.gain.setValueAtTime(.045,t);
  ng.gain.exponentialRampToValueAtTime(.0001,t+.018);

  n.connect(nf).connect(ng).connect(bus);

  n.start(t);
}

const sfx={

  key:()=>electricKey(),

  clear:()=>{
    electricKey();
    setTimeout(electricKey,48);
  },

  ok:()=>{
    drone([110,164.8,220,261.6],2.8,.09,"sine",1600);
    bell(880,2.6,.1,.3);
    bell(1318.5,3,.07,.55);
  },

  bad:()=>{
    drone([110,155.6],1.5,.12,"sawtooth",500);
    thud(60,.8,.6);
    bell(155.6,1.4,.08,.1);
  },

  link:()=>{
    drone([73.4,110,146.8],2.2,.1,"sine",700);
    whoosh(150,1800,.9,.14);
    bell(174.6,2.4,.1,.15);
    thud(70,.6,.45);
  }
};


/* ================= نمایشگر ================= */

const slots=[359,418,474,529,583,637].map(x=>{

  const d=document.createElement("div");

  d.className="slot";

/* ================= کد ================= */

let code="";
let locked=false;

function render(state=""){

  slots.forEach((s,i)=>{

    s.style.display=code[i]?"flex":"none";

    s.textContent=code[i]||"";

    s.className="slot "+state;

  });
}

function setLed(c){

  led.style.background=c;
  led.style.boxShadow="0 0 14px "+c;
  led.style.opacity=1;
}

function reset(){

  code="";

  render();

  led.style.opacity=0;

  locked=false;
}


/* =========================================================
   بررسی کد ۶ رقمی از جدول user و ستون phone
   ========================================================= */

async function verifyAccessCode(){

  let rows=[];


  /*
   * حالت اول:
   * اگر phone در Supabase از نوع integer / numeric باشد
   */

  try{

    rows=await sbGet(
      "user",
      `phone=eq.${code}`
    );

  }catch(e){

    rows=[];
  }


  /*
   * حالت دوم:
   * اگر phone از نوع text / varchar باشد
   */

  if(!Array.isArray(rows)||!rows.length){

    try{

      rows=await sbGet(
        "user",
        `phone=eq.%27${encodeURIComponent(code)}%27`
      );

    }catch(e){

      rows=[];
    }
  }


  return Array.isArray(rows)&&rows.length>0;
}


/* ================= ENTER ================= */

async function press(k){

  initAudio();

  if(locked)return;

  if(navigator.vibrate)
    navigator.vibrate(12);

  led.style.opacity=0;


  if(k==="CLEAR"){

    sfx.clear();

    code="";

    render();

    return;
  }


  if(k==="ENTER"){

    if(!code){

      sfx.key();

      return;
    }


    if(code.length!==ACCESS_CODE_LENGTH){

      sfx.bad();

      setLed("#ff2a2a");

      render("bad");

      setTimeout(reset,1100);

      return;
    }


    locked=true;

    sfx.key();

    setLed("#ffa31a");

    render();


    try{

      const verified=await verifyAccessCode();


      if(verified){

        /*
         * کد صحیح
         */

        sfx.ok();

        setLed("#2eea5a");

        render("ok");


        try{

          localStorage.setItem(
            "lingua_session_v1",
            JSON.stringify({
              code:code,
              verified:true,
              ts:Date.now()
            })
          );

        }catch(e){}


        const params=new URLSearchParams(
          location.search
        );

        const returnUrl=
          params.get("return")||
          "https://cllo.ir/";


        setTimeout(()=>{

          window.location.href=returnUrl;

        },900);


      }else{

        /*
         * کد اشتباه
         */

        sfx.bad();

        setLed("#ff2a2a");

        render("bad");

        term.classList.add("shake");

        setTimeout(()=>{

          term.classList.remove("shake");

        },420);

        setTimeout(reset,1500);
      }


    }catch(e){

      sfx.bad();

      setLed("#ff2a2a");

      render("bad");

      setTimeout(reset,1800);
    }


    return;
  }


  sfx.key(k);


  if(code.length<ACCESS_CODE_LENGTH){

    code+=k;

    render();
  }
}


/* ================= دکمه‌های عددی ================= */

const cols=[316,435,552];
const rows=[704,791,878,967];

const labels=[
  "1","2","3",
  "4","5","6",
  "7","8","9",

];

const btns={};

labels.forEach((k,i)=>{

  const b=document.createElement("button");

  b.className="key";

  b.setAttribute("aria-label",k);

  const r=px(
    b,

    98,

  );

  b.style.backgroundSize=
    (W/r.w*100)+"% "+
    (H/r.h*100)+"%";

  b.style.backgroundPosition=
    (r.l/(W-r.w)*100)+"% "+
    (r.t/(H-r.h)*100)+"%";


  const up=()=>{
    b.classList.remove("down");
  };


  b.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();

      b.classList.add("down");

      press(k);
    }
  );


  ["pointerup","pointerleave","pointercancel"]
  .forEach(ev=>
    b.addEventListener(ev,up)
  );


  term.appendChild(b);

  btns[k]=b;
});


/* ================= دکمه‌های خرید کد ================= */

[
  ["telegram",1174],
  ["whatsapp",1297],
  ["bale",1420]
].forEach(([name,y])=>{

  const a=document.createElement("a");

  a.className="link";

  a.setAttribute("aria-label",name);

      a.classList.add("down");

      sfx.link();

      if(navigator.vibrate)
        navigator.vibrate(20);
    }
  );


  [
    "pointerup",
    "pointerleave",
    "pointercancel"
  ].forEach(ev=>
    a.addEventListener(
      ev,
      ()=>a.classList.remove("down")
    )
  );

/* ================= کیبورد ================= */

addEventListener("keydown",e=>{

  if(e.repeat)return;

  const k=
    /^[0-9]$/.test(e.key)
      ?e.key
      :e.key==="Enter"
        ?"ENTER"
        :(e.key==="Backspace"||e.key==="Escape")
          ?"CLEAR"
          :null;


  if(!k)return;


  btns[k].classList.add("down");

  press(k);

  setTimeout(
    ()=>btns[k].classList.remove("down"),
    110
  );
});


/* ================= آماده شدن تصویر ================= */

(
  bg.decode
    ?bg.decode()
    :Promise.resolve()
)
.catch(()=>{})
.then(()=>{

  term.classList.add("ready");

});

</script>
