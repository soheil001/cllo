<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نویسنده صوتی هوشمند</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary: #6366f1;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.8;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1;
        }

        .dot.listening {
            background-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button.btn {
            flex: 2;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
            background-color: var(--primary);
        }

        button.btn.listening {
            background-color: var(--danger);
        }

        .btn-secondary {
            flex: 1;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎙️ نویسنده صوتی</h1>
            <button class="icon-btn" id="themeToggle">🌙</button>
        </header>

        <div class="editor-container">
            <textarea id="textBox" placeholder="روی دکمه شروع ضبط بزنید و صحبت کنید..."></textarea>
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="dot" id="statusDot"></div>
                    <span id="statusText">آماده برای ضبط</span>
                </div>
                <div id="wordCount">۰ کلمه</div>
            </div>
        </div>

        <div class="controls">
            <button id="recordBtn" class="btn">
                <span>شروع ضبط</span>
            </button>
            <button id="copyBtn" class="btn btn-secondary">کپی</button>
            <button id="clearBtn" class="btn btn-secondary">پاک کردن</button>
        </div>
    </div>

    <div class="toast" id="toast">متن کپی شد</div>

    <script>
        const textBox = document.getElementById('textBox');
        const recordBtn = document.getElementById('recordBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const themeToggle = document.getElementById('themeToggle');
        const wordCount = document.getElementById('wordCount');
        const toast = document.getElementById('toast');

        // بازیابی متن ذخیره شده
        if (localStorage.getItem('voice_note')) {
            textBox.value = localStorage.getItem('voice_note');
            updateWordCount();
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let manualStop = false;

        if (!SpeechRecognition) {
            alert('مرورگر شما از این قابلیت پشتیبانی نمی‌کند. لطفاً از گوگل کروم موبایل استفاده کنید.');
            recordBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                manualStop = false;
                statusDot.classList.add('listening');
                recordBtn.classList.add('listening');
                recordBtn.querySelector('span').textContent = 'توقف ضبط';
                statusText.textContent = 'در حال گوش دادن...';
            };

            recognition.onresult = function(event) {
                let interim = '';
                let finalStr = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalStr += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                if (finalStr) {
                    textBox.value += (textBox.value && !textBox.value.endsWith(' ') ? ' ' : '') + finalStr.trim();
                    saveAndCount();
                }
            };

            recognition.onerror = function(event) {
                console.log('Error: ', event.error);
                if (event.error === 'not-allowed') {
                    statusText.textContent = 'دسترسی به میکروفون رد شد!';
                    stopState();
                }
            };

            recognition.onend = function() {
                // اگر کاربر خودش دکمه توقف رو نزده بود، برای پایداری روی موبایل دوباره اجراش کن
                if (!manualStop) {
                    try {
                        recognition.start();
                        return;
                    } catch (e) {
                        console.log(e);
                    }
                }
                stopState();
            };
        }

        function stopState() {
            manualStop = true;
            statusDot.classList.remove('listening');
            recordBtn.classList.remove('listening');
            recordBtn.querySelector('span').textContent = 'شروع ضبط';
            statusText.textContent = 'آماده برای ضبط';
        }

        recordBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (statusDot.classList.contains('listening')) {
                manualStop = true;
                recognition.stop();
                stopState();
            } else {
                try {
                    textBox.focus();
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            }
        });

        textBox.addEventListener('input', saveAndCount);

        function saveAndCount() {
            localStorage.setItem('voice_note', textBox.value);
            const text = textBox.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = `${words} کلمه`;
        }

        clearBtn.addEventListener('click', () => {
            if (confirm('کل متن پاک شود؟')) {
                textBox.value = '';
                localStorage.removeItem('voice_note');
                updateWordCount();
            }
        });

        copyBtn.addEventListener('click', () => {
            if (!textBox.value) return;
            navigator.clipboard.writeText(textBox.value).then(() => {
                showToast('متن کپی شد!');
            });
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }

        function updateWordCount() {
            const text = textBox.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = `${words} کلمه`;
        }
    </script>
</body>
</html>
