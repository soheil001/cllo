<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نویسنده صوتی هوشمند</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .actions-top {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--border-color);
        }

        .editor-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 350px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1;
        }

        .dot.listening {
            background-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button.btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary.listening {
            background-color: var(--danger);
        }

        .btn-primary.listening:hover {
            background-color: var(--danger-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>
                نویسنده صوتی فارسی
            </h1>
            <div class="actions-top">
                <button class="icon-btn" id="themeToggle" title="تغییر حالت تاریک/روشن">🌙</button>
            </div>
        </header>

        <div class="editor-container">
            <textarea id="textBox" placeholder="روی دکمه‌ی «شروع ضبط» کلیک کنید و شروع به صحبت کنید... متن شما اینجا نوشته خواهد شد."></textarea>
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="dot" id="statusDot"></div>
                    <span id="statusText">آماده برای ضبط</span>
                </div>
                <div id="wordCount">تعداد کلمات: ۰</div>
            </div>
        </div>

        <div class="controls">
            <button id="recordBtn" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>
                <span id="recordBtnText">شروع ضبط صدا</span>
            </button>
            <button id="copyBtn" class="btn btn-secondary">کپی متن</button>
            <button id="clearBtn" class="btn btn-secondary">پاک کردن صفحه</button>
        </div>
    </div>

    <div class="toast" id="toast">متن با موفقیت کپی شد</div>

    <script>
        const textBox = document.getElementById('textBox');
        const recordBtn = document.getElementById('recordBtn');
        const recordBtnText = document.getElementById('recordBtnText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const themeToggle = document.getElementById('themeToggle');
        const wordCount = document.getElementById('wordCount');
        const toast = document.getElementById('toast');

        // بارگذاری متن ذخیره شده قبلی
        if (localStorage.getItem('voice_note')) {
            textBox.value = localStorage.getItem('voice_note');
            updateWordCount();
        }

        // بررسی پشتیبانی مرورگر
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (!SpeechRecognition) {
            alert('مرورگر شما از تبدیل صوت به متن پشتیبانی نمی‌کند. لطفاً از گوگل کروم (Google Chrome) استفاده کنید.');
            recordBtn.disabled = true;
            statusText.textContent = 'مرورگر پشتیبانی نمی‌شود';
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = true; // ضبط مداوم
            recognition.interimResults = true; // نمایش زنده کلمات

            let finalTranscript = '';

            recognition.onstart = function() {
                isListening = true;
                statusDot.classList.add('listening');
                recordBtn.classList.add('listening');
                statusText.textContent = 'در حال گوش دادن... صحبت کنید';
                recordBtnText.textContent = 'توقف ضبط';
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        textBox.value += (textBox.value ? ' ' : '') + event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                saveToLocalStorage();
                updateWordCount();
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                if(event.error === 'not-allowed') {
                    statusText.textContent = 'دسترسی به میکروفون رد شد.';
                } else {
                    statusText.textContent = 'خطا در تشخیص صدا: ' + event.error;
                }
                stopListeningState();
            };

            recognition.onend = function() {
                if (isListening) {
                    // اگر قطع شد ولی کاربر دستور توقف نداده بود، مجدد ادامه بده (برای پایداری بیشتر)
                    try {
                        recognition.start();
                    } catch (e) {
                        stopListeningState();
                    }
                } else {
                    stopListeningState();
                }
            };
        }

        function stopListeningState() {
            isListening = false;
            statusDot.classList.remove('listening');
            recordBtn.classList.remove('listening');
            statusText.textContent = 'آماده برای ضبط';
            recordBtnText.textContent = 'شروع ضبط صدا';
        }

        recordBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (isListening) {
                isListening = false;
                recognition.stop();
                stopListeningState();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        });

        // ذخیره خودکار در حال تایپ دستی
        textBox.addEventListener('input', () => {
            saveToLocalStorage();
            updateWordCount();
        });

        function saveToLocalStorage() {
            localStorage.setItem('voice_note', textBox.value);
        }

        function updateWordCount() {
            const text = textBox.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = `تعداد کلمات: ${persianDigits(words)}`;
        }

        function persianDigits(n) {
            return n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        // دکمه پاک کردن
        clearBtn.addEventListener('click', () => {
            if (confirm('آیا مطمئن هستید که می‌خواهید متن را پاک کنید؟')) {
                textBox.value = '';
                localStorage.removeItem('voice_note');
                updateWordCount();
            }
        });

        // دکمه کپی
        copyBtn.addEventListener('click', () => {
            if (!textBox.value) return;
            navigator.clipboard.writeText(textBox.value).then(() => {
                showToast('متن با موفقیت کپی شد!');
            });
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // تم تاریک/روشن
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }
        
        updateWordCount();
    </script>
</body>
</html>
