<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>ارسال پیام تلگرام</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;
  --card:#182235;
  --input:#0f1c30;
  --border:#2a3a55;
  --accent:#229ed9;
  --accent-hover:#1a8abf;
  --accent-dis:#2a4a5e;
  --text:#fff;
  --muted:#aaa;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-family:tahoma,sans-serif;
  color:var(--text);
  padding:20px 16px;
  padding-top:calc(var(--safe-top) + 20px);
  padding-bottom:calc(var(--safe-bot) + 20px);
}
.card{
  width:100%;
  max-width:400px;
  background:var(--card);
  padding:28px 24px;
  border-radius:25px;
  box-shadow:0 10px 40px #0005;
}
h2{
  text-align:center;
  font-size:20px;
  margin-bottom:4px;
}
.subtitle{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px;
}
label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  margin-top:16px;
}
input,textarea{
  width:100%;
  border:1.5px solid var(--border);
  outline:none;
  border-radius:12px;
  padding:12px 15px;
  font-size:15px;
  background:var(--input);
  color:var(--text);
  font-family:tahoma,sans-serif;
  direction:ltr;
  transition:border-color .2s;
}
textarea{
  height:110px;
  resize:none;
  direction:rtl;
}
input:focus,textarea:focus{border-color:var(--accent)}
button{
  width:100%;
  margin-top:20px;
  height:48px;
  border:0;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  font-family:tahoma,sans-serif;
  cursor:pointer;
  transition:background .2s,opacity .2s;
}
button:hover:not(:disabled){background:var(--accent-hover)}
button:disabled{background:var(--accent-dis);cursor:default}
#result{
  margin-top:14px;
  text-align:center;
  font-size:14px;
  min-height:22px;
  word-break:break-word;
  line-height:1.6;
}
.note{
  margin-top:16px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
  line-height:1.7;
}
</style>
</head>
<body>
<div class="card">
  <h2>📨 ارسال پیام به تلگرام</h2>
  <p class="subtitle">از طریق Claude به عنوان proxy</p>

  <label>توکن ربات (Bot Token)</label>
  <input type="text" id="token" placeholder="123456:ABC-DEF..." autocomplete="off"/>

  <label>شناسه چت (Chat ID)</label>
  <input type="text" id="chat_id" placeholder="مثلاً: 8884022816" value="8884022816"/>

  <label>پیام</label>
  <textarea id="message" placeholder="پیام خود را بنویسید..."></textarea>

  <button id="sendBtn" onclick="sendMessage()">ارسال پیام</button>

  <div id="result"></div>
  <p class="note">⚡ پیام از طریق Claude ارسال می‌شود تا مشکل CORS برطرف شود</p>
</div>

<script>
async function sendMessage() {
  const token   = document.getElementById("token").value.trim();
  const chat_id = document.getElementById("chat_id").value.trim();
  const message = document.getElementById("message").value.trim();
  const result  = document.getElementById("result");
  const btn     = document.getElementById("sendBtn");

  if (!token)   { result.innerHTML = "⚠ لطفاً توکن ربات را وارد کنید"; return; }
  if (!chat_id) { result.innerHTML = "⚠ لطفاً Chat ID را وارد کنید"; return; }
  if (!message) { result.innerHTML = "⚠ پیام خالی است"; return; }

  btn.disabled = true;
  result.innerHTML = "⏳ در حال ارسال...";

  try {
    const sample = await window.claude.use("sample");
    if (!sample) {
      result.innerHTML = "❌ قابلیت ارسال در دسترس نیست";
      btn.disabled = false;
      return;
    }

    const prompt = `You are an API caller. Call the Telegram Bot API to send a message.

Make a POST request to: https://api.telegram.org/bot${token}/sendMessage

With JSON body:
{
  "chat_id": "${chat_id}",
  "text": ${JSON.stringify(message)}
}

Use your web_search or fetch capability to actually call this URL.
Then return ONLY a JSON object like:
{"ok": true, "message_id": 123}
or
{"ok": false, "description": "error reason"}

Do not add any explanation. Return ONLY the JSON object.`;

    const response = await sample(prompt, {
      modelTier: "quick",
      tools: [{
        name: "send_telegram",
        description: "Send a message via Telegram Bot API",
        inputSchema: {
          type: "object",
          properties: {
            ok: { type: "boolean" },
            description: { type: "string" }
          }
        },
        execute: async (input) => {
          // Actual fetch from Claude's server side
          const url = `https://api.telegram.org/bot${token}/sendMessage`;
          const res = await fetch(url, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({chat_id, text: message})
          });
          const data = await res.json();
          return data;
        }
      }]
    });

    // Try to parse result
    let data;
    try {
      const clean = response.text.replace(/```json|```/g,"").trim();
      data = JSON.parse(clean);
    } catch(e) {
      // If JSON parse fails, check text for success/fail indicators
      if (response.text.includes('"ok":true') || response.text.includes('"ok": true')) {
        data = {ok: true};
      } else {
        data = {ok: false, description: response.text};
      }
    }

    if (data.ok) {
      result.innerHTML = "✅ پیام با موفقیت ارسال شد!";
      document.getElementById("message").value = "";
    } else {
      result.innerHTML = "❌ خطا: " + (data.description || "نامشخص");
    }

  } catch (err) {
    if (err.code === "not_granted") {
      result.innerHTML = "⚠ دسترسی رد شد. لطفاً دوباره تلاش کنید";
    } else if (err.code === "rate_limited") {
      result.innerHTML = "⚠ محدودیت نرخ. لطفاً چند ثانیه صبر کنید";
    } else {
      result.innerHTML = "❌ خطا: " + (err.message || err.code || "نامشخص");
    }
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
