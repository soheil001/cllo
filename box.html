<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Telegram Test</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0b1220;
font-family:tahoma;
color:#fff
}
.card{
width:350px;
background:#182235;
padding:25px;
border-radius:25px;
box-shadow:0 10px 40px #0005
}
h2{
text-align:center;
font-size:20px
}
textarea{
width:100%;
height:120px;
border:0;
outline:0;
resize:none;
border-radius:15px;
padding:15px;
font-size:16px
}
button{
width:100%;
margin-top:15px;
height:45px;
border:0;
border-radius:15px;
background:#229ed9;
color:white;
font-size:17px;
cursor:pointer
}
#result{
margin-top:15px;
text-align:center;
font-size:14px;
word-break:break-word
}
</style>

</head>

<body>

<div class="card">

<h2>ارسال تست به تلگرام</h2>

<textarea id="message" placeholder="پیام خود را بنویسید..."></textarea>

<button onclick="sendMessage()">ارسال پیام</button>

<div id="result"></div>

</div>


<script>

async function sendMessage(){

let message=document.getElementById("message").value;

if(!message){
document.getElementById("result").innerHTML="⚠️ پیام خالی است";
return;
}


// توکن ربات خودت را اینجا قرار بده
let token="YOUR_BOT_TOKEN";


// chat id شما
let chat_id="8884022816";


let url=
`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;


try{

let response=await fetch(url);

let data=await response.json();


if(data.ok){

document.getElementById("result").innerHTML="✅ پیام ارسال شد";

}else{

document.getElementById("result").innerHTML=
"❌ خطا: "+data.description;

}

}

catch(error){

document.getElementById("result").innerHTML=
"❌ خطای اتصال: "+error;

}

}

</script>

</body>
</html>
