<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Destination Cards</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#063f35;font-family:Arial,sans-serif;color:#fff}
.destination-section{width:100%;padding:35px 0 40px;overflow:hidden}
.destination-head{display:flex;align-items:center;justify-content:space-between;padding:0 7%;margin-bottom:22px}
.destination-head h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
.destination-arrows{display:flex;gap:9px}
.destination-arrows button{width:35px;height:35px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;font-size:20px;cursor:pointer}
.destination-scroll{display:flex;gap:20px;overflow-x:auto;overflow-y:hidden;padding:0 7% 18px;scroll-behavior:smooth;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.destination-scroll::-webkit-scrollbar{height:5px}
.destination-scroll::-webkit-scrollbar-track{background:transparent}
.destination-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:20px}
.destination-card{flex:0 0 275px;scroll-snap-align:start;border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:9px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.15)}
.card-image{height:210px;border-radius:16px;overflow:hidden;position:relative;background:#174d43}
.card-image img{width:100%;height:100%;object-fit:cover;display:block}
.rating{position:absolute;top:9px;left:9px;padding:6px 9px;border-radius:9px;background:rgba(245,250,249,.92);color:#263c38;font-size:12px;font-weight:700}
.rating span{color:#e5ad39;margin-right:3px}
.favorite{position:absolute;top:8px;right:8px;width:31px;height:31px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#e77e72;font-size:18px;cursor:pointer}
.price{position:absolute;right:8px;bottom:8px;padding:7px 10px;border-radius:10px;background:rgba(230,244,239,.9);color:#36534d;font-size:13px;font-weight:700}
.card-content{padding:9px 3px 2px}
.card-content h3{margin:0 0 5px;font-size:22px;font-weight:800}
.card-content p{margin:0;color:rgba(255,255,255,.68);font-size:12px}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.people{display:flex;align-items:center}
.people img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-6px}
.people img:first-child{margin-left:0}
.people span{font-size:12px;color:rgba(255,255,255,.75);margin-left:7px}
.action{border:0;border-radius:20px;padding:9px 14px;background:linear-gradient(100deg,#ffe1a7,#ffb58e);color:#31483f;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}
.dots{display:flex;justify-content:center;gap:7px;margin-top:5px}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28)}
.dots span.active{width:22px;border-radius:10px;background:#9de4d0}
@media(max-width:600px){
.destination-section{padding-top:28px}
.destination-head{padding:0 6%;margin-bottom:18px}
.destination-head h2{font-size:24px}
.destination-scroll{padding-left:6%;padding-right:6%;gap:15px}
.destination-card{flex-basis:275px}
}
</style>
</head>
<body>

<section class="destination-section">

  <div class="destination-head">
    <h2>Destination Cards</h2>
    <div class="destination-arrows">
      <button onclick="scrollCards(-1)">‹</button>
      <button onclick="scrollCards(1)">›</button>
    </div>
  </div>

  <div class="destination-scroll" id="destinationScroll">

    <div class="destination-card">
      <div class="card-image">
        <img src="http://fs3.centraldnserver.com/~planlife/pics/english/Vocabularypic.webp" alt="Destination">
        <div class="rating"><span>★</span> 4.5</div>
        <button class="favorite">♡</button>
        <div class="price">$299</div>
      </div>
      <div class="card-content">
        <h3>Mountain</h3>
        <p>Mountain Travel</p>
        <div class="card-bottom">
          <div class="people">
            <img src="https://i.pravatar.cc/50?img=12">
            <img src="https://i.pravatar.cc/50?img=32">
            <img src="https://i.pravatar.cc/50?img=47">
            <span>Rating</span>
          </div>
          <button class="action">Call to action</button>
        </div>
      </div>
    </div>

    <div class="destination-card">
      <div class="card-image">
        <img src="http://fs3.centraldnserver.com/~planlife/pics/english/Vocabularypic.webp" alt="Destination">
        <div class="rating"><span>★</span> 4.5</div>
        <button class="favorite">♡</button>
        <div class="price">$259</div>
      </div>
      <div class="card-content">
        <h3>Camping</h3>
        <p>Glassmorphism Layer</p>
        <div class="card-bottom">
          <div class="people">
            <img src="https://i.pravatar.cc/50?img=5">
            <img src="https://i.pravatar.cc/50?img=18">
            <img src="https://i.pravatar.cc/50?img=29">
            <span>Rating</span>
          </div>
          <button class="action">Call to action</button>
        </div>
      </div>
    </div>

    <div class="destination-card">
      <div class="card-image">
        <img src="http://fs3.centraldnserver.com/~planlife/pics/english/Vocabularypic.webp" alt="Destination">
        <div class="rating"><span>★</span> 4.5</div>
        <button class="favorite">♡</button>
        <div class="price">$799</div>
      </div>
      <div class="card-content">
        <h3>Forest Trail</h3>
        <p>Glassmorphism Layer</p>
        <div class="card-bottom">
          <div class="people">
            <img src="https://i.pravatar.cc/50?img=11">
            <img src="https://i.pravatar.cc/50?img=21">
            <img src="https://i.pravatar.cc/50?img=41">
            <span>Rating</span>
          </div>
          <button class="action">Call to action</button>
        </div>
      </div>
    </div>

    <div class="destination-card">
      <div class="card-image">
        <img src="http://fs3.centraldnserver.com/~planlife/pics/english/Vocabularypic.webp" alt="Destination">
        <div class="rating"><span>★</span> 4.8</div>
        <button class="favorite">♡</button>
        <div class="price">$499</div>
      </div>
      <div class="card-content">
        <h3>Adventure</h3>
        <p>Explore New Places</p>
        <div class="card-bottom">
          <div class="people">
            <img src="https://i.pravatar.cc/50?img=14">
            <img src="https://i.pravatar.cc/50?img=35">
            <img src="https://i.pravatar.cc/50?img=49">
            <span>Rating</span>
          </div>
          <button class="action">Call to action</button>
        </div>
      </div>
    </div>

  </div>

  <div class="dots">
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>

</section>

<script>
const slider=document.getElementById("destinationScroll");
function scrollCards(dir){
  slider.scrollBy({left:dir*295,behavior:"smooth"});
}
</script>

</body>
</html>
