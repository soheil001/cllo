<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ارسال پیام تلگرام</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b1220;
  font-family:tahoma;
  color:#fff;
}
.card{
  width:370px;
  background:#182235;
  padding:28px;
  border-radius:25px;
  box-shadow:0 10px 40px #0005;
}
h2{
  text-align:center;
  font-size:20px;
  margin-top:0;
}
label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-bottom:6px;
  margin-top:14px;
}
input, textarea{
  width:100%;
  border:1.5px solid #2a3a55;
  outline:none;
  border-radius:12px;
  padding:12px 15px;
  font-size:15px;
  background:#0f1c30;
  color:#fff;
  font-family:tahoma;
  direction:ltr;
}
textarea{
  height:110px;
  resize:none;
  direction:rtl;
}
input:focus, textarea:focus{
  border-color:#229ed9;
}
button{
  width:100%;
  margin-top:18px;
  height:46px;
  border:0;
  border-radius:14px;
  background:#229ed9;
  color:#fff;
  font-size:16px;
  font-family:tahoma;
  cursor:pointer;
  transition:background .2s;
}
button:hover{ background:#1a8abf; }
button:disabled{ background:#2a4a5e; cursor:default; }
#result{
  margin-top:14px;
  text-align:center;
  font-size:14px;
  min-height:22px;
  word-break:break-word;
}
</style>
</head>
<body>

<div class="card">
  <h2>📨 ارسال پیام به تلگرام</h2>

  <label>توکن ربات (Bot Token)</label>
  <input type="text" id="token" placeholder="123456:ABC-DEF..." />

  <label>شناسه چت (Chat ID)</label>
  <input type="text" id="chat_id" placeholder="مثلاً: 8884022816" value="8884022816" />

  <label>پیام</label>
  <textarea id="message" placeholder="پیام خود را بنویسید..."></textarea>

  <button id="sendBtn" onclick="sendMessage()">ارسال پیام</button>

  <div id="result"></div>
</div>

<script>
async function sendMessage() {
  const token   = document.getElementById("token").value.trim();
  const chat_id = document.getElementById("chat_id").value.trim();
  const message = document.getElementById("message").value.trim();
  const result  = document.getElementById("result");
  const btn     = document.getElementById("sendBtn");

  if (!token) {
    result.innerHTML = "⚠ لطفاً توکن ربات را وارد کنید";
    return;
  }
  if (!chat_id) {
    result.innerHTML = "⚠ لطفاً Chat ID را وارد کنید";
    return;
  }
  if (!message) {
    result.innerHTML = "⚠ پیام خالی است";
    return;
  }

  btn.disabled = true;
  result.innerHTML = "⏳ در حال ارسال...";

  const url = `https://api.telegram.org/bot${token}/sendMessage`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chat_id, text: message })
    });

    const data = await response.json();

    if (data.ok) {
      result.innerHTML = "✅ پیام با موفقیت ارسال شد!";
      document.getElementById("message").value = "";
    } else {
      result.innerHTML = "❌ خطا: " + data.description;
    }
  } catch (error) {
    result.innerHTML = "❌ خطای اتصال: " + error.message;
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
