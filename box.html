<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Destination Cards</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 92% 15%,rgba(255,157,92,.45),transparent 25%),
    radial-gradient(circle at 15% 75%,rgba(0,230,190,.22),transparent 32%),
    radial-gradient(circle at 65% 55%,rgba(0,190,160,.25),transparent 30%),
    linear-gradient(135deg,#063b32 0%,#075b4c 38%,#079b7d 72%,#12b895 100%);
}

/* SECTION */

.destination-section{
  width:100%;
  padding:38px 0 45px;
  position:relative;
  overflow:hidden;
}

/* TITLE */

.destination-head{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  margin-bottom:22px;
}

.destination-head h2{
  margin:0;
  font-size:29px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.6px;
  text-shadow:0 2px 12px rgba(0,0,0,.12);
}

/* ARROWS */

.destination-arrows{
  display:flex;
  gap:9px;
}

.destination-arrows button{
  width:36px;
  height:36px;
  padding:0;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  color:#fff;
  font-size:22px;
  line-height:36px;
  cursor:pointer;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.22),
    0 6px 18px rgba(0,0,0,.08);
  transition:.25s;
}

.destination-arrows button:hover{
  background:rgba(255,255,255,.2);
  transform:translateY(-1px);
}

/* HORIZONTAL SCROLL */

.destination-scroll{
  width:100%;
  display:flex;
  gap:20px;
  overflow-x:auto;
  overflow-y:visible;
  padding:3px 7% 20px;
  scroll-behavior:smooth;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}

.destination-scroll::-webkit-scrollbar{
  height:5px;
}

.destination-scroll::-webkit-scrollbar-track{
  background:rgba(255,255,255,.05);
  border-radius:20px;
}

.destination-scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.25);
  border-radius:20px;
}

/* GLASS CARD */

.destination-card{
  flex:0 0 275px;
  position:relative;
  overflow:hidden;
  scroll-snap-align:start;

  padding:9px;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.25) 0%,
      rgba(255,255,255,.12) 38%,
      rgba(255,255,255,.08) 100%
    );

  border:1px solid rgba(255,255,255,.34);

  backdrop-filter:blur(25px) saturate(145%);
  -webkit-backdrop-filter:blur(25px) saturate(145%);

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.38),
    inset 0 -1px 1px rgba(0,0,0,.08),
    0 18px 45px rgba(0,0,0,.18);

  transition:.3s ease;
}

.destination-card:hover{
  transform:translateY(-4px);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.42),
    0 22px 50px rgba(0,0,0,.22);
}

/* GLASS LIGHT */

.destination-card:before{
  content:"";
  position:absolute;
  top:-85px;
  left:-75px;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(255,255,255,.17);
  filter:blur(45px);
  pointer-events:none;
}

/* TOP REFLECTION */

.destination-card:after{
  content:"";
  position:absolute;
  top:0;
  left:15%;
  width:70%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.7),
    transparent
  );
  pointer-events:none;
}

/* IMAGE */

.card-image{
  width:100%;
  height:210px;
  position:relative;
  overflow:hidden;
  border-radius:17px;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.2);

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.2),
    0 5px 15px rgba(0,0,0,.08);
}

.card-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

/* IMAGE GLASS OVERLAY */

.card-image:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.1),
      transparent 35%,
      rgba(0,0,0,.1)
    );
  pointer-events:none;
}

/* RATING */

.rating{
  position:absolute;
  top:9px;
  left:9px;
  z-index:3;

  padding:6px 10px;

  border-radius:9px;

  background:rgba(255,255,255,.78);

  border:1px solid rgba(255,255,255,.55);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  color:#344841;
  font-size:12px;
  font-weight:700;

  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.rating span{
  color:#e6ad3d;
  margin-right:3px;
}

/* FAVORITE */

.favorite{
  position:absolute;
  top:8px;
  right:8px;
  z-index:3;

  width:32px;
  height:32px;
  padding:0;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.45);

  background:rgba(255,255,255,.2);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  color:#fff;
  font-size:20px;
  line-height:30px;

  cursor:pointer;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.25),
    0 5px 12px rgba(0,0,0,.08);
}

/* PRICE */

.price{
  position:absolute;
  right:8px;
  bottom:8px;
  z-index:3;

  padding:7px 11px;

  border-radius:10px;

  background:rgba(225,242,237,.75);

  border:1px solid rgba(255,255,255,.42);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  color:#304b45;
  font-size:13px;
  font-weight:700;

  box-shadow:0 5px 14px rgba(0,0,0,.08);
}

/* CONTENT */

.card-content{
  padding:10px 3px 3px;
}

.card-content h3{
  margin:0 0 5px;

  color:#fff;

  font-size:22px;
  line-height:1.1;
  font-weight:800;

  text-shadow:0 2px 10px rgba(0,0,0,.14);
}

.card-content p{
  margin:0;

  color:rgba(255,255,255,.7);

  font-size:12px;
}

/* BOTTOM */

.card-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:13px;
}

/* PEOPLE */

.people{
  display:flex;
  align-items:center;
}

.people img{
  width:24px;
  height:24px;

  object-fit:cover;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.8);

  margin-left:-6px;
}

.people img:first-child{
  margin-left:0;
}

.people span{
  margin-left:7px;

  color:rgba(255,255,255,.75);

  font-size:12px;
}

/* BUTTON */

.action{
  border:1px solid rgba(255,255,255,.48);

  border-radius:20px;

  padding:9px 14px;

  background:
    linear-gradient(
      135deg,
      rgba(255,239,197,.92),
      rgba(255,181,142,.9)
    );

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.65),
    0 5px 15px rgba(0,0,0,.1);

  color:#31483f;

  font-size:11px;
  font-weight:800;

  white-space:nowrap;

  cursor:pointer;

  transition:.2s;
}

.action:hover{
  transform:scale(1.04);
}

/* DOTS */

.dots{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:7px;

  margin-top:3px;
}

.dots span{
  width:7px;
  height:7px;

  border-radius:50%;

  background:rgba(255,255,255,.3);
}

.dots span.active{
  width:22px;

  border-radius:10px;

  background:#a2e7d5;

  box-shadow:0 0 10px rgba(162,231,213,.3);
}

/* MOBILE */

@media(max-width:600px){

  .destination-section{
    padding:30px 0 40px;
  }

  .destination-head{
    padding:0 6%;
    margin-bottom:18px;
  }

  .destination-head h2{
    font-size:24px;
  }

  .destination-arrows button{
    width:34px;
    height:34px;
    font-size:20px;
  }

  .destination-scroll{
    gap:15px;
    padding-left:6%;
    padding-right:6%;
  }

  .destination-card{
    flex:0 0 275px;
  }
}
</style>
</head>
