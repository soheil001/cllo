<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ارسال پیام تلگرام</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b1220;
  font-family:tahoma,sans-serif;
  color:#fff;
  padding:20px 16px;
}
.card{
  width:100%;
  max-width:400px;
  background:#182235;
  padding:28px 24px;
  border-radius:25px;
  box-shadow:0 10px 40px #0005;
}
h2{
  text-align:center;
  font-size:20px;
  margin-bottom:20px;
}
label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-bottom:6px;
  margin-top:16px;
}
input,textarea{
  width:100%;
  border:1.5px solid #2a3a55;
  outline:none;
  border-radius:12px;
  padding:12px 15px;
  font-size:15px;
  background:#0f1c30;
  color:#fff;
  font-family:tahoma,sans-serif;
  direction:ltr;
  transition:border-color .2s;
}
textarea{
  height:110px;
  resize:none;
  direction:rtl;
}
input:focus,textarea:focus{border-color:#229ed9}
button{
  width:100%;
  margin-top:20px;
  height:48px;
  border:0;
  border-radius:14px;
  background:#229ed9;
  color:#fff;
  font-size:16px;
  font-family:tahoma,sans-serif;
  cursor:pointer;
  transition:background .2s;
}
button:hover:not(:disabled){background:#1a8abf}
button:disabled{background:#2a4a5e;cursor:default}
#result{
  margin-top:14px;
  text-align:center;
  font-size:14px;
  min-height:22px;
  word-break:break-word;
  line-height:1.6;
}
</style>
</head>
<body>
<div class="card">
  <h2>📨 ارسال پیام به تلگرام</h2>

  <label>شناسه چت (Chat ID)</label>
  <input type="text" id="chat_id" placeholder="مثلاً: 8884022816" value="8884022816"/>

  <label>پیام</label>
  <textarea id="message" placeholder="پیام خود را بنویسید..."></textarea>

  <button id="sendBtn" onclick="sendMessage()">ارسال پیام</button>
  <div id="result"></div>
</div>

<script>
const BOT_TOKEN = "8762829572:AAEirHKKYNUL6lDiAEUhdQz7XGTQTnPsfUc";

async function sendMessage() {
  const chat_id = document.getElementById("chat_id").value.trim();
  const message = document.getElementById("message").value.trim();
  const result  = document.getElementById("result");
  const btn     = document.getElementById("sendBtn");

  if (!chat_id) { result.innerHTML = "⚠ لطفاً Chat ID را وارد کنید"; return; }
  if (!message) { result.innerHTML = "⚠ پیام خالی است"; return; }

  btn.disabled = true;
  result.innerHTML = "⏳ در حال ارسال...";

  // استفاده از corsproxy.io برای دور زدن مشکل CORS
  const apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
  const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(apiUrl);

  try {
    const response = await fetch(proxyUrl, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({chat_id, text: message})
    });

    const data = await response.json();

    if (data.ok) {
      result.innerHTML = "✅ پیام با موفقیت ارسال شد!";
      document.getElementById("message").value = "";
    } else {
      result.innerHTML = "❌ خطا: " + (data.description || "نامشخص");
    }
  } catch (err) {
    result.innerHTML = "❌ خطای اتصال: " + err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
