/* =========================================================
   UTILITIES
   ========================================================= */

function shuffle(array){

  const copy=[...array];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy;
}

function buildQuiz(){

  return shuffle(
    QUESTIONS.map((q,index)=>({

      ...q,

      originalIndex:index,

      options:shuffle(q.options)

    }))
  ).map(q=>{

    const correctText=QUESTIONS[q.originalIndex].options[
      QUESTIONS[q.originalIndex].answer
    ];

    return {
      ...q,
      answer:q.options.indexOf(correctText)
    };

  });
}

function transition(render){

  card.style.opacity='0';
  card.style.transform='translateX(20px)';

  setTimeout(()=>{

    render();

    requestAnimationFrame(()=>{

      card.style.transition='.35s ease';
      card.style.opacity='1';
      card.style.transform='translateX(0)';

    });

  },150);
}

/* =========================================================
   ACCESS CHECK
   ========================================================= */

async function checkAccess(){

  const input=document.getElementById('access-code');
  const error=document.getElementById('access-error');
  const button=document.getElementById('access-button');

  const code=input.value.trim().replace(/\D/g,'');

  if(!/^\d{5}$/.test(code)){

    input.classList.add('shake');

    setTimeout(()=>{
      input.classList.remove('shake');
    },400);

    error.textContent='The access code must contain exactly four digits.';

    return;
  }

  button.disabled=true;
  button.textContent='Checking...';

  try{

    const rows=await supabaseGet(
      'subscriptions',
      `code=eq.${code}&is_active=eq.true`
    );

    if(Array.isArray(rows)&&rows.length){

      state.screen='start';

      transition(renderStart);

    }else{

      error.textContent=
        'The access code is invalid or has expired.';

      input.classList.add('shake');

      setTimeout(()=>{
        input.classList.remove('shake');
      },400);

      button.disabled=false;
      button.textContent='Enter Assessment →';
    }

  }catch(errorObject){

    console.error(errorObject);

    error.textContent=
      'Unable to connect to the server. Please try again.';

    button.disabled=false;
    button.textContent='Enter Assessment →';
  }

}

function startAssessment(){

  state.questions=buildQuiz();
  state.current=0;
  state.answers=[];
  state.score=0;
  state.screen='quiz';

  transition(renderQuestion);
}


/* =========================================================
   QUESTION SCREEN
   ========================================================= */

function renderQuestion(){

  const q=state.questions[state.current];

  const total=state.questions.length;

  const answered=state.answers[state.current];

  const progress=Math.round(
    (state.current/total)*100
  );

  const wrong=
    answered!==undefined &&
    answered!==q.answer;

  card.innerHTML=`

    <div class="brand">

      <div
        class="brand-icon"
        style="width:35px;height:35px;font-size:16px"
      >
        🇬🇧
      </div>

      <div class="brand-name">

        <strong>IELTS 1 — Advanced</strong>

        English Assessment

      </div>

    </div>


    <div class="progress-wrap">

      <div class="progress-top">

        <strong>
          Question ${state.current+1} of ${total}
        </strong>

        <span>
          ${progress}% complete
        </span>

      </div>

      <div class="progress-bg">

        <div
          class="progress"
          style="width:${progress}%"
        ></div>

      </div>

    </div>


    <div class="question-badge">
      ✦ ${q.badge}
    </div>


    <div class="question">
      ${q.question}
    </div>


    <div class="options">

      ${q.options.map((option,index)=>{

        let className='';

        if(answered!==undefined){

          if(index===q.answer){
            className='correct';
          }

          if(index===answered&&answered!==q.answer){
            className='wrong';
          }

        }

        return `

          <div
            class="option ${className} ${answered!==undefined?'disabled':''}"
            onclick="selectAnswer(${index})"
          >

            <div class="letter">
              ${LETTERS[index]}
            </div>

            <div class="option-text">
              ${option}
            </div>

          </div>

        `;

      }).join('')}

    </div>


    ${wrong?`

      <div class="feedback">

        <div class="feedback-title">
          ✕ Why this answer is incorrect
        </div>

        <div class="feedback-text">
          ${q.explanation}
        </div>

        <div class="feedback-answer">
          ✓ Correct answer:
          ${q.options[q.answer]}
        </div>

      </div>

    `:''}


    <div class="question-actions">

      ${state.current>0?`

        <button
          class="btn-secondary"
          onclick="previousQuestion()"
        >
          ← Previous
        </button>

      `:''}


      <button
        class="btn-primary"
        id="next-button"
        ${answered===undefined||wrong?'disabled':''}
        onclick="nextQuestion()"
      >
        ${state.current===total-1
          ?'View Results ✓'
          :'Next Question →'}
      </button>

    </div>

  `;

}


/* =========================================================
   SELECT ANSWER
   ========================================================= */

function selectAnswer(index){

  if(state.answers[state.current]!==undefined){
    return;
  }

  const q=state.questions[state.current];

  state.answers[state.current]=index;

  if(index===q.answer){
    state.score++;
  }

  renderQuestion();

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function nextQuestion(){

  if(state.answers[state.current]===undefined){
    return;
  }

  const q=state.questions[state.current];

  if(state.answers[state.current]!==q.answer){
    return;
  }

  if(state.current<state.questions.length-1){

    state.current++;

    transition(renderQuestion);

  }else{

    state.screen='result';

    transition(renderResult);

  }

}

function previousQuestion(){

  if(state.current>0){

    state.current--;

    transition(renderQuestion);

  }

}


/* =========================================================
   RESULT
   ========================================================= */

function renderResult(){

  const total=state.questions.length;

  const percentage=Math.round(
    state.score/total*100
  );

  let title;
  let emoji;
  let message;

  if(percentage<40){

    emoji='🌱';

    title='Keep Building Your Advanced English';

    message=
      'Your result indicates that several advanced structures still require focused practice. Review complex grammar, academic vocabulary, conditionals, inversion and collocations before attempting the next level.';

  }else if(percentage<60){

    emoji='📚';

    title='Developing Advanced Proficiency';

    message=
      'You demonstrated knowledge of many advanced structures, but some distinctions remain inconsistent. Continued practice with precision, academic vocabulary and complex sentence patterns will strengthen your performance.';

  }else if(percentage<75){

    emoji='🚀';

    title='Strong Advanced Performance';

    message=
      'You handled a substantial range of advanced English structures successfully. Continue working on subtle grammatical distinctions, lexical precision and academic usage.';

  }else if(percentage<90){

    emoji='🏆';

    title='Very Strong IELTS 1 Performance';

    message=
      'Your result shows strong command of advanced English. You appear comfortable with complex grammatical structures, academic vocabulary and nuanced language choices.';

  }else{

    emoji='🔥';

    title='Exceptional IELTS 1 Performance';

    message=
      'You demonstrated exceptionally strong control of the language tested in this level. The next stage introduces substantially more demanding distinctions and professional-level English.';

  }

  card.innerHTML=`

    <div class="result">

      <div class="brand">

        <div class="brand-icon">🇬🇧</div>

        <div class="brand-name">

          <strong>IELTS English Assessment</strong>

          IELTS 1 — Advanced

        </div>

      </div>


      <span class="result-emoji">
        ${emoji}
      </span>


      <div class="result-label">
        IELTS 1 — Advanced Result
      </div>


      <div class="result-title">
        ${title}
      </div>


      <div class="divider"></div>


      <div class="score">
        ${state.score}
      </div>


      <div class="score-total">
        out of ${total} questions
      </div>


      <div class="percentage">
        ${percentage}% correct
      </div>


      <div class="result-grid">

        <div class="result-box">

          <div
            class="result-number"
            style="color:#6EE7B7"
          >
            ${state.score}
          </div>

          <div class="result-small">
            CORRECT
          </div>

        </div>


        <div class="result-box">

          <div
            class="result-number"
            style="color:#FCA5A5"
          >
            ${total-state.score}
          </div>

          <div class="result-small">
            INCORRECT
          </div>

        </div>


        <div class="result-box">

          <div
            class="result-number"
            style="color:#90CAF9"
          >
            ${percentage}%
          </div>

          <div class="result-small">
            ACCURACY
          </div>

        </div>

      </div>


      <div class="result-message">

        <strong>
          Assessment Feedback
        </strong>

        <p>
          ${message}
        </p>

      </div>


      <button
        class="btn-primary"
        style="margin-top:20px"
        onclick="startAssessment()"
      >
        Take IELTS 1 Again ↻
      </button>

    </div>

  `;

}

function openSubscriptionModal(){

  const modal=
    document.getElementById('subscription-modal');

  const content=
    document.getElementById('modal-content');

  modal.classList.remove('hidden');

  content.innerHTML=`

    <label class="input-label">
      PHONE NUMBER
    </label>

    <input
      class="modal-input"
      id="phone-input"
      type="tel"
      inputmode="numeric"
      maxlength="15"
      placeholder="Enter your registered phone number"
    >

    <div
      id="modal-error"
      class="error"
    ></div>

    <div class="modal-actions">

      <button
        class="modal-submit"
        onclick="retrieveCode()"
      >
        Get Code
      </button>

      <button
        class="modal-cancel"
        onclick="closeSubscriptionModal()"
      >
        Cancel
      </button>

    </div>

  `;

  setTimeout(()=>{
    document.getElementById('phone-input')?.focus();
  },100);

}

function closeSubscriptionModal(){

  document
    .getElementById('subscription-modal')
    .classList.add('hidden');

}

async function retrieveCode(){

  const input=document.getElementById('phone-input');

  const error=document.getElementById('modal-error');

  let phone=input.value.trim().replace(/\D/g,'');

  if(phone.startsWith('0')){
    phone=phone.slice(1);
  }

  if(phone.length<10){

    error.textContent=
      'Please enter a valid phone number.';

    return;

  }

  error.textContent='Checking...';

  try{

    const rows=await supabaseGet(
      'subscriptions',
      `phone=eq.${phone}&is_active=eq.true`
    );

    if(!Array.isArray(rows)||!rows.length){

      error.textContent=
        'No active subscription was found for this phone number.';

      return;

    }

    const subscription=rows[0];

    let code=(subscription.code||'').trim();

    if(!code){

      code=generateCode();

      await supabasePatch(
        'subscriptions',
        `id=eq.${subscription.id}`,
        {code}
      );

    }

    document.getElementById('modal-title').textContent=
      'Your Subscription Code';

    document.getElementById('modal-subtitle').textContent=
      'Use this four-digit code to access IELTS 1.';

    document.getElementById('modal-content').innerHTML=`

      <div class="code-reveal">

        <div
          style="
            color:#6EE7B7;
            font-size:11px;
            font-weight:800;
          "
        >
          YOUR ASSESSMENT CODE
        </div>

        <div class="revealed-code">
          ${code}
        </div>

      </div>

      <button
        class="btn-primary"
        style="margin-top:18px"
        onclick="closeSubscriptionModal()"
      >
        Done ✓
      </button>

    `;

  }catch(errorObject){

    console.error(errorObject);

    error.textContent=
      'A server error occurred. Please try again.';

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

renderAccess();

</script>
