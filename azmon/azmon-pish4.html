<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>آزمون زبان انگلیسی — پیشرفته ۴</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-behavior: smooth; height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(140deg, #0D1B2A 0%, #12304F 45%, #0A2540 70%, #0D1B2A 100%);
    min-height: 100vh; color: #fff; direction: rtl; overflow-x: hidden; height: 100%;
  }
  .bg-orb { position:fixed; border-radius:50%; filter:blur(90px); opacity:.15; pointer-events:none; z-index:0; }
  .orb1 { width:520px; height:520px; background:#2176AE; top:-180px; right:-120px; }
  .orb2 { width:420px; height:420px; background:#0D4F8A; bottom:-120px; left:-120px; }
  .orb3 { width:280px; height:280px; background:#0E7FC0; top:50%; left:50%; transform:translate(-50%,-50%); }

  #app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 16px; }

  .card {
    position:relative;
    background:rgba(255,255,255,0.06); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,0.13); border-radius:28px; width:100%; max-width:640px;
    padding:40px 38px; box-shadow:0 36px 90px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.09);
    animation:fadeUp .45s cubic-bezier(.22,.87,.33,1) both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }

  .brand { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .brand-icon {
    width:42px; height:42px; background:linear-gradient(135deg,#2176AE,#0D4F8A);
    border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 16px rgba(33,118,174,0.45); flex-shrink:0;
  }
  .brand-name { font-size:13px; font-weight:600; color:rgba(255,255,255,0.65); line-height:1.4; }
  .brand-name span { display:block; color:#fff; font-size:15px; font-weight:700; }

  .progress-wrap { margin-bottom:32px; }
  .progress-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; color:rgba(255,255,255,0.5); font-weight:500; }
  .step-label { color:rgba(255,255,255,0.85); font-weight:600; font-size:13px; }
  .progress-bar-bg { height:6px; background:rgba(255,255,255,0.09); border-radius:99px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:linear-gradient(90deg,#56B4E9,#2176AE); border-radius:99px; transition:width .6s cubic-bezier(.22,.87,.33,1); box-shadow:0 0 10px rgba(86,180,233,0.55); }

  .q-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(33,118,174,0.18); border:1px solid rgba(33,118,174,0.35); border-radius:99px; padding:4px 14px; font-size:11px; font-weight:600; color:#90CAF9; margin-bottom:14px; }
  .q-text { font-size:18px; font-weight:700; color:#fff; line-height:1.65; margin-bottom:26px; }
  .q-text .en { font-family:'Vazirmatn',sans-serif; font-weight:800; color:#90CAF9; letter-spacing:.02em; direction:ltr; display:inline-block; }

  .options { display:flex; flex-direction:column; gap:10px; }
  .option {
    background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.11); border-radius:16px;
    padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:14px;
    transition:all .22s cubic-bezier(.22,.87,.33,1); position:relative; overflow:hidden;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .option::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(33,118,174,0.18),rgba(13,79,138,0.12)); opacity:0; transition:opacity .22s; border-radius:inherit; }
  .option:hover { border-color:rgba(86,180,233,0.5); transform:translateX(-3px); }
  .option:hover::before { opacity:1; }
  .option:active { transform:scale(0.98); }
  .option.selected { border-color:#2176AE; background:rgba(33,118,174,0.18); box-shadow:0 0 0 1px rgba(33,118,174,0.4),0 8px 24px rgba(33,118,174,0.2); }
  .option.selected::before { opacity:1; }
  .option.correct { border-color:#10B981!important; background:rgba(16,185,129,0.15)!important; box-shadow:0 0 0 1px rgba(16,185,129,0.4),0 8px 24px rgba(16,185,129,0.2)!important; }
  .option.wrong   { border-color:#EF4444!important; background:rgba(239,68,68,0.15)!important; box-shadow:0 0 0 1px rgba(239,68,68,0.4)!important; }
  .opt-letter { width:30px; height:30px; border:2px solid rgba(255,255,255,0.2); border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:rgba(255,255,255,0.45); transition:all .2s; position:relative; z-index:1; }
  .option.selected .opt-letter { border-color:#2176AE; background:#2176AE; color:#fff; }
  .option.correct  .opt-letter { border-color:#10B981; background:#10B981; color:#fff; }
  .option.wrong    .opt-letter { border-color:#EF4444; background:#EF4444; color:#fff; }
  .opt-text { font-size:15px; font-weight:500; color:rgba(255,255,255,0.85); line-height:1.5; flex:1; position:relative; z-index:1; }
  .option.selected .opt-text { color:#fff; font-weight:600; }
  .option.correct  .opt-text { color:#6EE7B7; font-weight:600; }
  .option.wrong    .opt-text { color:#FCA5A5; }
  .opt-icon { font-size:17px; position:relative; z-index:1; opacity:0; transition:opacity .2s; min-width:20px; text-align:center; }
  .option.correct .opt-icon { opacity:1; }
  .option.wrong   .opt-icon { opacity:1; }

  /* Explanation popup */
  .explanation-popup {
    position:relative; width:100%; margin:0 0 22px;
    padding:18px 18px 16px;
    background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    box-shadow:0 18px 45px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
    animation:explainIn .3s cubic-bezier(.22,.87,.33,1) both;
  }
  .explanation-popup::before {
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(120deg,rgba(239,68,68,.10),rgba(86,180,233,.06),rgba(255,255,255,.03));
    pointer-events:none;
  }
  .explanation-head { display:flex; align-items:center; gap:10px; position:relative; z-index:1; margin-bottom:8px; }
  .explanation-icon {
    width:34px; height:34px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.25);
    font-size:16px;
  }
  .explanation-title { font-size:13px; font-weight:800; color:#fff; }
  .explanation-text {
    position:relative; z-index:1;
    font-size:13px; line-height:1.85; color:rgba(255,255,255,.72);
    margin-bottom:14px;
  }
  .explanation-correct {
    position:relative; z-index:1;
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:#6EE7B7; font-weight:700;
    background:rgba(16,185,129,.08); border:1px solid rgba(16,185,129,.16);
    border-radius:10px; padding:8px 10px; margin-bottom:12px;
  }
  .explanation-btn {
    position:relative; z-index:1; width:100%; padding:11px 16px;
    border:1px solid rgba(255,255,255,.14); border-radius:11px;
    background:linear-gradient(135deg,#2176AE,#0D4F8A);
    color:#fff; font-family:'Vazirmatn',sans-serif; font-size:13px;
    font-weight:800; cursor:pointer; box-shadow:0 7px 20px rgba(33,118,174,.28);
    transition:transform .2s,box-shadow .2s;
  }
  .explanation-btn:hover { transform:translateY(-1px); box-shadow:0 10px 25px rgba(33,118,174,.38); }
  .explanation-btn:active { transform:scale(.98); }
  @keyframes explainIn {
    from { opacity:0; transform:translateY(-10px) scale(.98); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }

  .btn-primary { width:100%; padding:16px 24px; background:linear-gradient(135deg,#2176AE,#0D4F8A); color:#fff; border:none; border-radius:14px; font-family:'Vazirmatn',sans-serif; font-size:16px; font-weight:700; cursor:pointer; margin-top:24px; box-shadow:0 8px 28px rgba(33,118,174,0.4); transition:all .22s; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(33,118,174,0.5); }
  .btn-primary:active { transform:scale(0.98); }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .btn-ghost { background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.14); color:rgba(255,255,255,0.7); border-radius:12px; padding:12px 22px; font-family:'Vazirmatn',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn-ghost:hover { background:rgba(255,255,255,0.12); color:#fff; }

  /* Access screen */
  .access-icon { width:72px; height:72px; background:linear-gradient(135deg,#2176AE,#0D4F8A); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; margin:0 auto 24px auto; box-shadow:0 12px 40px rgba(33,118,174,0.45); }
  .access-title { font-size:22px; font-weight:800; color:#fff; text-align:center; margin-bottom:8px; }
  .access-subtitle { font-size:14px; color:rgba(255,255,255,0.5); text-align:center; margin-bottom:32px; line-height:1.7; }
  .code-input-label { font-size:12px; font-weight:600; color:rgba(255,255,255,0.45); margin-bottom:8px; display:block; }
  .code-input { width:100%; padding:16px 20px; background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.14); border-radius:14px; color:#fff; font-family:'Vazirmatn',sans-serif; font-size:18px; font-weight:700; text-align:center; letter-spacing:.1em; outline:none; transition:all .22s; direction:ltr; }
  .code-input::placeholder { color:rgba(255,255,255,0.18); font-size:14px; font-weight:400; }
  .code-input:focus { border-color:rgba(86,180,233,0.6); background:rgba(33,118,174,0.1); box-shadow:0 0 0 3px rgba(33,118,174,0.15); }
  .code-input.error { border-color:rgba(239,68,68,0.6)!important; background:rgba(239,68,68,0.08)!important; animation:shake .35s both; }
  .code-input.success { border-color:rgba(16,185,129,0.6)!important; background:rgba(16,185,129,0.08)!important; }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  .error-msg { display:flex; align-items:center; gap:6px; color:#FCA5A5; font-size:13px; font-weight:600; margin-top:10px; opacity:0; transition:opacity .2s; }
  .error-msg.visible { opacity:1; }
  .access-footer { text-align:center; margin-top:20px; font-size:12px; color:rgba(255,255,255,0.22); }
  .btn-get-code { width:100%; padding:14px 24px; background:rgba(255,255,255,0.05); border:1.5px dashed rgba(86,180,233,0.4); color:#90CAF9; border-radius:14px; font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:600; cursor:pointer; margin-top:12px; transition:all .22s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-get-code:hover { background:rgba(33,118,174,0.12); border-color:rgba(86,180,233,0.7); color:#fff; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9998; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); padding:20px; }
  .modal-overlay.hidden { display:none; }
  .modal-box { background:linear-gradient(145deg,#0f2237,#162d44); border:1px solid rgba(86,180,233,0.25); border-radius:24px; padding:36px 32px; width:100%; max-width:480px; box-shadow:0 40px 100px rgba(0,0,0,0.6); animation:modalIn .35s cubic-bezier(.22,.87,.33,1); }
  @keyframes modalIn { from{opacity:0;transform:scale(0.92) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .modal-icon { width:60px; height:60px; background:linear-gradient(135deg,#2176AE,#0D4F8A); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 20px auto; box-shadow:0 8px 28px rgba(33,118,174,0.4); }
  .modal-title { font-size:20px; font-weight:800; color:#fff; text-align:center; margin-bottom:6px; }
  .modal-subtitle { font-size:13px; color:rgba(255,255,255,0.45); text-align:center; margin-bottom:28px; line-height:1.7; }
  .form-field { margin-bottom:16px; }
  .form-label { font-size:12px; font-weight:600; color:rgba(255,255,255,0.45); margin-bottom:7px; display:block; }
  .form-input { width:100%; padding:13px 16px; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.12); border-radius:12px; color:#fff; font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:500; outline:none; transition:all .2s; }
  .form-input:focus { border-color:rgba(86,180,233,0.55); background:rgba(33,118,174,0.1); box-shadow:0 0 0 3px rgba(33,118,174,0.12); }
  .form-input::placeholder { color:rgba(255,255,255,0.2); }
  .form-input.field-error { border-color:rgba(239,68,68,0.6)!important; }
  .modal-btn-row { display:flex; gap:10px; margin-top:8px; }
  .modal-btn-submit { flex:1; padding:14px; background:linear-gradient(135deg,#2176AE,#0D4F8A); color:#fff; border:none; border-radius:12px; font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 20px rgba(33,118,174,0.38); transition:all .22s; }
  .modal-btn-submit:hover { transform:translateY(-1px); }
  .modal-btn-cancel { padding:14px 20px; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.6); border-radius:12px; font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; }
  .modal-btn-cancel:hover { background:rgba(255,255,255,0.1); color:#fff; }
  .code-reveal-box { background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(16,185,129,0.06)); border:2px solid rgba(16,185,129,0.4); border-radius:16px; padding:24px; text-align:center; margin-top:8px; }
  .code-reveal-label { font-size:12px; color:#6EE7B7; font-weight:700; letter-spacing:.05em; margin-bottom:12px; }
  .code-reveal-number { font-size:42px; font-weight:900; color:#fff; letter-spacing:.18em; background:rgba(0,0,0,0.3); border-radius:12px; padding:14px 24px; display:inline-block; border:1px solid rgba(16,185,129,0.3); text-shadow:0 0 28px rgba(16,185,129,0.5); direction:ltr; }
  .code-reveal-msg { font-size:13px; color:rgba(255,255,255,0.55); margin-top:14px; line-height:1.75; }
  .modal-error { color:#FCA5A5; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.25); border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.7; margin-top:12px; display:none; }
  .modal-error.show { display:block; }
  .spinner { display:inline-block; width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.25); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-left:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .code-input.shake { animation:shake .35s both; border-color:rgba(239,68,68,0.6)!important; background:rgba(239,68,68,0.08)!important; }

  /* Start */
  .start-icon { width:72px; height:72px; background:linear-gradient(135deg,#2176AE,#0D4F8A); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:24px; box-shadow:0 12px 40px rgba(33,118,174,0.45); }
  .start-title { font-size:24px; font-weight:800; color:#fff; line-height:1.45; margin-bottom:14px; }
  .start-desc { font-size:14px; color:rgba(255,255,255,0.6); line-height:1.8; margin-bottom:26px; }
  .start-stats { display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
  .stat-chip { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.11); border-radius:99px; padding:7px 16px; font-size:12px; font-weight:600; color:rgba(255,255,255,0.65); display:flex; align-items:center; gap:6px; }
  .stat-chip span { color:#90CAF9; }

  /* Result */
  .result-wrap { text-align:center; }
  .result-big-emoji { font-size:72px; margin-bottom:16px; display:block; animation:popIn .5s cubic-bezier(.22,.87,.33,1) both; }

  .result-level-label { font-size:13px; color:#90CAF9; font-weight:700; letter-spacing:.06em; margin-bottom:8px; }
  .result-level-title { font-size:26px; font-weight:900; color:#fff; margin-bottom:6px; }

  .result-score-big { font-size:88px; font-weight:900; line-height:1; }
  .result-score-total { font-size:18px; color:rgba(255,255,255,0.35); font-weight:600; margin-top:4px; }
  .result-pct-badge { display:inline-flex; align-items:center; gap:6px; border-radius:99px; padding:8px 22px; font-size:16px; font-weight:800; margin-top:12px; }
  .result-message-box { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:18px; padding:22px 26px; margin-top:22px; text-align:right; }
  .result-message-title { font-size:14px; font-weight:700; color:#90CAF9; margin-bottom:10px; }
  .result-message-text { font-size:14px; color:rgba(255,255,255,0.65); line-height:1.85; }
  .result-stats-row { display:flex; gap:10px; margin-top:18px; }
  .result-stat-mini { flex:1; background:rgba(255,255,255,0.04); border-radius:14px; padding:14px 10px; text-align:center; border:1px solid rgba(255,255,255,0.07); }
  .result-stat-mini-icon { font-size:18px; margin-bottom:5px; }
  .result-stat-mini-num { font-size:18px; font-weight:800; }
  .result-stat-mini-label { font-size:10px; color:rgba(255,255,255,0.35); font-weight:600; margin-top:3px; }

  .slide-exit { animation:slideExit .22s ease forwards; }
  .slide-enter { animation:slideEnter .35s cubic-bezier(.22,.87,.33,1) forwards; }
  @keyframes slideExit { to{opacity:0;transform:translateX(30px)} }
  @keyframes slideEnter { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }

  @media (max-width:480px) {
    .card { padding:28px 18px; border-radius:22px; }
    .q-text { font-size:16px; }
    .opt-text { font-size:14px; }
    .start-title { font-size:20px; }
    .modal-box { padding:28px 20px; }
    .explanation-popup { padding:15px 14px 14px; margin-bottom:18px; }
    .explanation-text { font-size:12.5px; }
    .result-score-big { font-size:72px; }
  }
</style>
</head>

}

async function sbPatch(table, filter, body) {
  const url = `${SUPABASE_URL}/rest/v1/${table}?${filter}`;
  const r = await fetch(url, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  });
  return r.ok || r.status === 204;
}

function genCode() {

function shuffleArray(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function buildShuffled() {
  // برای حفظ index توضیحات، پس از shuffle، originalIndex را نگه می‌داریم
  return shuffleArray(QUESTIONS_BANK.map((q,i)=>({...q,originalIndex:i}))).map(q=>{
    const ct=q.options[q.correct];
    const opts=shuffleArray(q.options);
    return {...q, options:opts, correct:opts.indexOf(ct)};
  });
}

  const s=performance.now();
  function f(n){const p=Math.min((n-s)/dur,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f);}

}

async function submitPhone(){
  const input=document.getElementById('f-phone');
  const btn=document.getElementById('m-btn');
  const errEl=document.getElementById('m-error');
  if(!input||!btn) return;

  errEl.classList.remove('show');
  input.classList.remove('field-error');

  let phone = input.value.trim()
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\D/g,'');
  if(phone.startsWith('0')) phone = phone.slice(1);

  if(phone.length < 10){
    input.classList.add('field-error');
    errEl.textContent = 'شماره تلفن معتبر نیست (مثلاً ۰۹۱۲۳۴۵۶۷۸۹)';
    errEl.classList.add('show');
    return;
  }

  btn.disabled=true;
  btn.innerHTML='در حال بررسی... <span class="spinner"></span>';

  try {
    const rows = await sbGet('subscriptions', `phone=eq.${phone}&is_active=eq.true`);

    if(!Array.isArray(rows) || rows.length === 0){
      errEl.textContent = 'این شماره تلفن در سیستم ثبت نشده یا اشتراک فعالی ندارد.';
      errEl.classList.add('show');
      btn.disabled=false;
      btn.innerHTML='دریافت کد ←';
      return;
    }

    const row = rows[0];
    let code = (row.code || '').trim();

    if(!code){
      code = genCode();
      await sbPatch('subscriptions', `id=eq.${row.id}`, { code: code });
    }

    document.getElementById('m-icon').textContent='🎉';
    document.getElementById('m-title').textContent='کد اشتراک شما';
    document.getElementById('m-sub').textContent='این کد را ذخیره کنید و برای ورود به آزمون استفاده کنید.';
    document.getElementById('m-body').innerHTML=`
      <div class="code-reveal-box">
        <div class="code-reveal-label">✦ کد اختصاصی آزمون شما</div>
        <div class="code-reveal-number">${code}</div>
        <div class="code-reveal-msg">کد را یادداشت کنید.<br>برای ورود به آزمون پیشرفته ۱ همین کد را وارد کنید.</div>
      </div>
      <button class="modal-btn-submit" onclick="closeModal()" style="margin-top:20px;width:100%">متوجه شدم ✓</button>
    `;

  } catch(err){
    console.error(err);
    errEl.textContent = 'خطا در ارتباط با سرور. لطفاً چند لحظه بعد دوباره تلاش کنید.';
    errEl.classList.add('show');
    btn.disabled=false;
    btn.innerHTML='دریافت کد ←';
  }
}

    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\D/g,'');
  inp.value = val;

  if(!/^\d{4}$/.test(val)){
    inp.classList.add('shake');
    setTimeout(()=>inp.classList.remove('shake'),400);
    errText.textContent='کد باید یک عدد ۴ رقمی باشد.';
    errMsg.classList.add('visible');
    return;
  }

  btn.disabled=true;
  btn.innerHTML='در حال بررسی... <span class="spinner"></span>';

  try {
    const rows = await sbGet('subscriptions', `code=eq.${val}&is_active=eq.true`);

    if(Array.isArray(rows) && rows.length > 0){
      inp.classList.add('success');
      setTimeout(()=>{ state.screen='start'; transition(renderStart); }, 400);
    } else {
      inp.classList.add('shake');
      setTimeout(()=>inp.classList.remove('shake'),400);
      errText.textContent='کد وارد شده معتبر نیست یا منقضی شده.';
      errMsg.classList.add('visible');
      btn.disabled=false;
      btn.innerHTML='ورود به آزمون ←';
    }
  } catch(err){
    console.error(err);
    inp.classList.add('shake');
    setTimeout(()=>inp.classList.remove('shake'),400);
    errText.textContent='خطا در ارتباط با سرور. دوباره تلاش کنید.';
    errMsg.classList.add('visible');
    btn.disabled=false;
    btn.innerHTML='ورود به آزمون ←';
  }
}

// ── Start ───────────────────────────────────────
function renderStart(){
  card.innerHTML=`
    <div class="brand">
      <div class="brand-icon">🇬🇧</div>
      <div class="brand-name"><span>آزمون زبان انگلیسی</span>سطح پیشرفته ۱</div>
    </div>
    <div class="start-icon">📝</div>
    <div class="start-title">آزمون ارزیابی سطح پیشرفته ۱</div>
    <div class="start-desc">این آزمون سطح B1 ابتدایی را می‌سنجد. سوال‌ها شامل زمان‌های پیچیده‌تر مثل Present Perfect، گذشته استمراری، مجهول، شرطی، Phrasal Verbs، جمله وصفی، نقل قول غیرمستقیم و لغات پیشرفته‌تر است.</div>
    <div class="start-stats">
      <div class="stat-chip">⏱️ <span>حدود ۱۵ دقیقه</span></div>
      <div class="stat-chip">📊 <span>۵۰ سوال</span></div>
      <div class="stat-chip">🎯 <span>سطح B1 ابتدایی</span></div>
    </div>
    <button class="btn-primary" onclick="startQuiz()">شروع آزمون ←</button>
  `;
}

// ── Question ────────────────────────────────────
function renderQuestion(){
  const q=state.shuffled[state.currentQ];
  const total=state.shuffled.length;
  const progress=Math.round((state.currentQ/total)*100);
  const answered=state.answers[state.currentQ];
  const isWrong=answered!==undefined && answered!==q.correct;

  card.innerHTML=`
    <div class="brand" style="margin-bottom:18px">
      <div class="brand-icon" style="width:32px;height:32px;font-size:15px;border-radius:8px">🇬🇧</div>
      <div class="brand-name" style="font-size:11px"><span style="font-size:13px">آزمون زبان انگلیسی</span>پیشرفته ۱</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="step-label">سوال ${toPersian(state.currentQ+1)} از ${toPersian(total)}</span>
        <span>${toPersian(progress)}٪ تکمیل شده</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
    </div>

    ${isWrong ? `
      <div class="explanation-popup" id="explanation-popup">
        <div class="explanation-head">
          <div class="explanation-icon">💡</div>
          <div class="explanation-title">چرا این پاسخ اشتباه بود؟</div>
        </div>
        <div class="explanation-text">${getExplanation(q.originalIndex, q)}</div>
        <div class="explanation-correct">✓ پاسخ درست: ${q.options[q.correct]}</div>
        <button class="explanation-btn" onclick="acknowledgeExplanation()">متوجه شدم ✓</button>
      </div>
    ` : ''}

    <div class="q-badge">✦ ${q.badge}</div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="options-list">
      ${q.options.map((opt,i)=>{
        let cls='';
        if(answered!==undefined){
          if(i===q.correct)cls='correct';
          else if(i===answered&&answered!==q.correct)cls='wrong';
        }
        const icon=cls==='correct'?'✓':cls==='wrong'?'✕':'';
        const disabled=answered!==undefined?'pointer-events:none':'';
        return `<div class="option ${cls}" onclick="selectAnswer(${i})" style="${disabled}">
          <div class="opt-letter">${LETTERS[i]}</div>
          <div class="opt-text">${opt}</div>
          <div class="opt-icon">${icon}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:22px;align-items:center">
      ${state.currentQ>0?`<button class="btn-ghost" onclick="prevQ()">→ قبلی</button>`:''}
      <button class="btn-primary" id="next-btn" style="margin-top:0;${answered===undefined||isWrong?'opacity:.4;cursor:not-allowed':''}"
        onclick="nextQ()" ${answered===undefined||isWrong?'disabled':''}>
        ${state.currentQ===total-1?'مشاهده نتیجه ✓':'سوال بعدی ←'}
      </button>
    </div>
  `;
}

function acknowledgeExplanation(){
  const popup=document.getElementById('explanation-popup');
  if(popup){
    popup.style.animation='none';
    popup.style.opacity='0';
    popup.style.transform='translateY(-8px)';
    popup.style.transition='opacity .18s ease, transform .18s ease';
  }
  setTimeout(()=>{ nextQ(); },180);
}

function selectAnswer(idx){
  if(state.answers[state.currentQ]!==undefined)return;
  const q=state.shuffled[state.currentQ];
  state.answers[state.currentQ]=idx;
  if(idx===q.correct)state.score++;

  document.querySelectorAll('.option').forEach((el,i)=>{
    if(i===q.correct){el.classList.add('correct');el.querySelector('.opt-icon').textContent='✓';}
    else if(i===idx&&idx!==q.correct){el.classList.add('wrong');el.querySelector('.opt-icon').textContent='✕';}
    el.style.pointerEvents='none';
  });

  if(idx!==q.correct){
    renderQuestion();
    return;
  }

  const btn=document.getElementById('next-btn');
  if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';}
}

function nextQ(){ if(state.answers[state.currentQ]===undefined)return; if(state.currentQ<state.shuffled.length-1){state.currentQ++;transition(renderQuestion);}else{state.screen='result';transition(renderResult);} }
function prevQ(){ if(state.currentQ>0){state.currentQ--;transition(renderQuestion);} }

// ── Result ──────────────────────────────────────
function renderResult(){
  const total=state.shuffled.length;
  const pct=Math.round((state.score/total)*100);
  let emoji,levelTitle,scoreColor,pctBadgeClass,message;

  if(pct<=40){
    emoji='🌱'; levelTitle='نیاز به تمرین بیشتر'; scoreColor='#F87171';
    pctBadgeClass='background:rgba(239,68,68,0.15);border:1.5px solid rgba(239,68,68,0.4);color:#FCA5A5;';
    message=`<div class="result-message-title">💡 راهنمای پیشرفت</div><div class="result-message-text">سوال‌های این سطح نیاز به تسلط کامل بر گرامر پایه دارند. پیشنهاد می‌شود ابتدا مفاهیم Present Perfect، گذشته استمراری و ساختارهای Passive را مرور کنید.<br><br>با تمرین منظم به این سطح خواهید رسید! 💪</div>`;
  } else if(pct<=70){
    emoji='📖'; levelTitle='سطح متوسط B1'; scoreColor='#FBBF24';
    pctBadgeClass='background:rgba(245,158,11,0.15);border:1.5px solid rgba(245,158,11,0.4);color:#FCD34D;';
    message=`<div class="result-message-title">🚀 در مسیر درست هستید!</div><div class="result-message-text">درک خوبی از مفاهیم پیشرفته ابتدایی دارید. تمرین بیشتر روی Conditional، Phrasal Verbs و Reported Speech شما را به سطح بالاتری می‌رساند.<br><br>ادامه دهید! ⭐</div>`;
  } else {
    emoji='🏆'; levelTitle='سطح B1 قوی'; scoreColor='#34D399';
    pctBadgeClass='background:rgba(16,185,129,0.15);border:1.5px solid rgba(16,185,129,0.4);color:#6EE7B7;';
    message=`<div class="result-message-title">🎉 عالی بودید!</div><div class="result-message-text">تسلط بسیار خوبی بر مفاهیم پیشرفته ۱ دارید. آماده‌اید به سطح B1 کامل بروید و مهارت‌هایی مثل Writing، Speaking و درک مطلب پیشرفته‌تر را تقویت کنید.<br><br>به شما افتخار می‌کنیم! 🌟</div>`;
  }

  card.innerHTML=`
    <div class="result-wrap">
      <span class="result-big-emoji">${emoji}</span>
      <div class="result-level-label">نتیجه ارزیابی شما — پیشرفته ۱</div>
      <div class="result-level-title">${levelTitle}</div>
      <div class="result-divider"></div>
      <div class="result-score-display">
        <div class="result-score-big" style="color:${scoreColor}" id="score-num">۰</div>
        <div class="result-score-total">از ${toPersian(total)} سوال</div>
        <div style="margin-top:14px"><span class="result-pct-badge" style="${pctBadgeClass}" id="pct-badge">۰٪ موفقیت</span></div>
      </div>
      <div class="result-stats-row">
        <div class="result-stat-mini"><div class="result-stat-mini-icon">✅</div><div class="result-stat-mini-num" style="color:#6EE7B7">${toPersian(state.score)}</div><div class="result-stat-mini-label">صحیح</div></div>
        <div class="result-stat-mini"><div class="result-stat-mini-icon">❌</div><div class="result-stat-mini-num" style="color:#FCA5A5">${toPersian(total-state.score)}</div><div class="result-stat-mini-label">اشتباه</div></div>
        <div class="result-stat-mini"><div class="result-stat-mini-icon">📊</div><div class="result-stat-mini-num" style="color:${scoreColor}">${toPersian(pct)}٪</div><div class="result-stat-mini-label">درصد</div></div>
      </div>
      <div class="result-message-box">${message}</div>
    </div>
  `;
  setTimeout(()=>{
    animateCounter(document.getElementById('score-num'),0,state.score,1100,v=>toPersian(Math.round(v)));
    animateCounter(document.getElementById('pct-badge'),0,pct,1200,v=>toPersian(Math.round(v))+'٪ موفقیت');
  },100);
}

function startQuiz(){
  state.shuffled=buildShuffled();
  Object.assign(state,{screen:'quiz',currentQ:0,answers:[],score:0});
  transition(renderQuestion);
}

renderAccess();
</script>
</body>
</html>
