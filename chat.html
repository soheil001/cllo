<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Test</title>
<style>
body{font-family:tahoma;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.box{width:320px;background:#222;padding:20px;border-radius:20px}
textarea{width:100%;height:100px;border-radius:12px;padding:10px;box-sizing:border-box;font-size:16px}
button{width:100%;margin-top:15px;padding:12px;border:0;border-radius:12px;background:#229ed9;color:white;font-size:16px;cursor:pointer}
</style>
</head>

<body>

<div class="box">
<h3>ارسال تست به تلگرام</h3>
<textarea id="msg" placeholder="پیام خود را بنویسید..."></textarea>
<button onclick="sendTelegram()">ارسال</button>
<p id="result"></p>
</div>

<script>
async function sendTelegram(){

let text=document.getElementById("msg").value;

let token="BOT_TOKEN";
let chatId="8884022816";

let url=`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`;

let res=await fetch(url);
let data=await res.json();

document.getElementById("result").innerHTML=data.ok?"✅ ارسال شد":"❌ خطا";
}
</script>

</body>
</html>
