<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CllO</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#05080d;padding:16px;font-family:system-ui,sans-serif}
.w{width:min(380px,100%);position:relative}
.d{position:relative;line-height:0}
.d img{width:100%;display:block;border-radius:22px;filter:drop-shadow(0 20px 35px #0008)}
#s{position:absolute;left:23.2%;top:23.6%;width:53.6%;height:2.5%;display:flex;direction:ltr;gap:3px;justify-content:center;pointer-events:none}
.o{flex:1;max-width:17px;aspect-ratio:1;border:1.5px solid #649fe68c;border-radius:3px;background:#0612234d;transition:.15s}
.o.f{background:linear-gradient(145deg,#8fe8ff,#3b9dff);border-color:#b9ecff;box-shadow:0 0 8px #32aaffa6}
.o.c{background:#35e879;border-color:#9affbd;box-shadow:0 0 10px #35e879cc}
.o.w{background:#ff3e52;border-color:#ff9ca7;box-shadow:0 0 10px #ff3e52d9}
.k{position:absolute;left:19.5%;top:46.2%;width:61%;height:43%;display:grid;grid:repeat(4,1fr)/repeat(3,1fr);gap:2.5% 3.5%;direction:ltr}
.b{background:0;border:0;border-radius:13px;cursor:pointer;transition:.1s}
.b:active{transform:scale(.9);filter:brightness(.4)}
#t{text-align:center;margin-top:12px;font-size:13px;color:#8a9bb0;min-height:18px}
</style>
</head>
<body>
<div class="w">
<div class="d">
<img src="https://cllo.ir/login123/IMG_5168.png" alt="CllO">
<div id="s"></div>
<div class="k">
<button class="b" data-k="1"></button><button class="b" data-k="2"></button><button class="b" data-k="3"></button>
<button class="b" data-k="4"></button><button class="b" data-k="5"></button><button class="b" data-k="6"></button>
<button class="b" data-k="7"></button><button class="b" data-k="8"></button><button class="b" data-k="9"></button>
<button class="b" data-k="x"></button><button class="b" data-k="0"></button><button class="b" data-k="e"></button>
</div>
</div>
<div id="t"></div>
</div>
<script>
const C="1234567890";let c="";
const S=document.getElementById("s"),T=document.getElementById("t");
for(let i=0;i<10;i++)S.innerHTML+='<div class="o"></div>';
const B=[...S.children];
const R=()=>B.forEach((b,i)=>b.className="o"+(i<c.length?" f":""));
const A=n=>{if(c.length<10){c+=n;T.textContent="";R()}};
const X=()=>{c=c.slice(0,-1);T.textContent="";R()};
const E=()=>{if(c.length!=10){T.textContent="کد باید ۱۰ رقم باشد";return}const ok=c===C;B.forEach(b=>b.className="o "+(ok?"c":"w"));T.textContent=ok?"کد صحیح است ✓":"کد اشتباه است ✕"};
document.querySelectorAll(".b").forEach(b=>b.onclick=()=>{const k=b.dataset.k;k=="x"?X():k=="e"?E():A(k)});
onkeydown=e=>/^[0-9]$/.test(e.key)?A(e.key):e.key=="Backspace"?X():e.key=="Enter"?E():0;
R();
</script>
</body>
</html>
